name: candidate-screener
version: 2.2.0
author: buy-side-research-system
namespace: research.equity
summary: Outbound idea funnel from hypothesis to sourced candidate list
description: >
  Turns a theme, event, hypothesis, or quantitative condition into a sourced
  long/short candidate list, then recommends 1-2 names for deeper research.
trigger:
  keywords:
    - 找受益股
    - 找受损方
    - candidate
    - candidates
    - idea generation
    - screening
    - thematic screening
    - quant screening
    - EV/EBITDA
    - FCF yield
    - ROIC
    - 数据中心电力
    - 关税受损
  description: 当用户要从主题、假设、事件或筛选条件生成候选股票列表时触发
category: research
tags:
  - candidate-screener
  - idea-generation
  - thematic-screening
  - quant-screening
  - long-short
capabilities:
  - mode: Thematic
  - mode: Quant
  - mode: Mixed
  - writes: screens/[hypothesis-slug]-[YYYY-MM-DD].md
requires:
  - CLAUDE.md §3 source policy
workflow_dependencies:
  - can_feed: stock-quickread
  - can_feed: peer-deep-dive
  - can_feed: pair-trade
  - distinct_from: information-impact
