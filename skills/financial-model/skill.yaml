name: financial-model
version: 2.1.0
author: buy-side-research-system
namespace: research.equity

summary: Build or update revenue-first Excel financial models
description: |
  用于搭建新的 buy-side Excel model，或根据新财报更新已有 Excel model。
  第一版重点是 revenue split / segment drivers，不强制标准模板，不迁移已有模型结构。

trigger:
  keywords:
    - "搭一个 model"
    - "build a model"
    - "financial model"
    - "Excel model"
    - "拆收入"
    - "revenue model"
    - "更新已有 model"
    - "根据新财报更新模型"
    - "refresh model"
  description: "当用户要搭新模型、拆收入、或根据财报更新已有 Excel model 时触发"

category: research
tags:
  - financial-model
  - revenue-model
  - excel-model
  - earnings-update
  - segment-drivers

capabilities:
  - mode: "Build New Model"
  - mode: "Update Existing Model"
  - output_path: "coverage/[ticker]/model.xlsx"
  - focus: "revenue split and segment drivers"
  - preserves_existing_workbook: true

requires:
  - "CLAUDE.md §3 source policy"

workflow_dependencies:
  - "can_follow": "stock-quickread"
  - "feeds_into": "alpha-thesis"
  - "can_be_triggered_by": "earnings-setup post-print"
  - "feeds_into": "thesis-tracker"
  - "can_trigger": "decision-journal"

anti_patterns:
  - "forcing standard 5-sheet template"
  - "migrating existing model without user request"
  - "overwriting formulas with hardcodes"
  - "inventing undisclosed segment drivers"
