metadata_schema_version: 1
name: 'meta-skill'
id: 'meta-skill'
display_name: 'Meta Skill'
version: '1.1.1'
system_generation: '3.5.0-dev'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Create, modify, review, and validate buy-side research plugin skills, metadata, validators, and governance.'
description: 'Create, modify, review, and validate buy-side research plugin skills, metadata, validators, and governance.'
tags:
  - 'meta-skill'
  - 'skill-authoring'
  - 'skill-governance'
  - 'validator'
  - 'operations'
trigger:
  type: 'keyword'
  keywords:
    - 'meta-skill'
    - 'write a skill'
    - 'create skill'
    - 'modify skill'
    - 'update skill'
    - 'skill authoring'
    - 'skill governance'
    - 'validate skill'
    - '改 skill'
    - '写 skill'
    - '新增 skill'
    - '修改 validator'
  description: '当用户要创建、修改、审查或验证本插件 skills / metadata / validators / governance 时触发'
capabilities:
  modes:
    - 'New Skill Design'
    - 'Existing Skill Rewrite'
    - 'Governance / Validator Update'
    - 'Review / Gap Audit'
  requirements:
    - 'classify skills as research or operations'
    - 'assign research_layer only for research skills'
    - 'keep active skills flat under skills/[skill-name]/SKILL.md'
    - 'do not recreate meta.json'
    - 'do not restore v2 state workflows'
    - 'sync docs, manifests, and validators when governance changes'
artifact_policy:
  save_policy: 'none'
  default_artifact: 'conversation-only'
  canonical_location: 'conversation-only'
  save_trigger: 'does not create research artifacts; edits plugin source only when the user explicitly requests implementation'
workflow:
  stage: 'skill-authoring'
  can_follow:
    - 'user-governance-request'
    - 'validator-failure'
  feeds_into:
    - 'SKILL.md'
    - 'skill.yaml'
    - 'validators'
    - 'docs'
  can_trigger:
    - 'validate-skill-metadata'
    - 'validate-skill-structure'
quality_gates:
  anti_patterns:
    - 'restoring_meta_json'
    - 'nesting_active_skills_by_category'
    - 'forcing_operations_into_research_template'
    - 'forgetting_validator_updates'
    - 'forgetting_public_docs'
  required_checks:
    - 'category_research_or_operations'
    - 'research_layer_for_research_only'
    - 'artifact_policy_present'
    - 'active_skill_count_synced'
    - 'release_package_validator_synced'
