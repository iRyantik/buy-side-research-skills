name: alpha-thesis
version: 1.2.0
author: buy-side-research-system
namespace: research.equity

summary: 构建有 edge 的投资 thesis
description: |
  用于买方研究员构建一个有真实 edge 的单股 investment thesis（long-only 或 short-only）。
  特点：必须有 variant view、catalyst、kill criteria、sizing 逻辑
  输出是可以拿去 pitch 给 PM 的完整投资逻辑。Long X + Short Y、hedge candidate、
  pair trade 或 hedged structure 使用 pair-trade。
  
trigger:
  keywords:
    - "帮我搭一下 thesis"
    - "单股 thesis"
    - "多头 thesis"
    - "空头 thesis"
    - "long thesis"
    - "short thesis"
    - "帮我把 thesis 整理一下"
    - "我有个想法"
    - "帮我成型"
    - "为什么我看多"
    - "为什么我看空"
    - "帮我搭一个 pitch"
  description: "当用户要建立或整理单股 long-only / short-only 投资观点时触发；pair、hedge candidate 或 Long X Short Y 使用 pair-trade"

category: research
tags:
  - thesis
  - ic-memo
  - conviction
  - buy-side
  - investment-decision

capabilities:
  - generates: "8-section single-name investment thesis with variant view"
  - output_format: "800-1500 字 完整逻辑"
  - includes: "catalyst、kill criteria、bull/base/bear scenarios、sizing"
  - can_feed: "research-journal or next-step"
  - distinct_from: "pair-trade handles Long X Short Y, hedge candidates, and hedged structures"

requires:
  - "CLAUDE.md §3 source policy"

prerequisites:
  - "stock-quickread (recommended)"

anti_patterns:
  - "没有 variant view"
  - "定性描述，无数字支撑"
  - "催化剂都是'长期'"
  - "止损条件过于空泛"
  - "handling Long X Short Y or hedge candidate instead of using pair-trade"

workflow_dependencies:
  - "after": "stock-quickread"
  - "before": "bear-pre-mortem"
  - "feeds_into": "earnings-setup, bear-pre-mortem, research-journal, next-step"
