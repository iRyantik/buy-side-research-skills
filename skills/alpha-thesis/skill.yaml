metadata_schema_version: 1
name: 'alpha-thesis'
id: 'alpha-thesis'
display_name: 'Alpha Thesis'
version: '1.0.2'
system_generation: '3.7.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'deep-work'
summary: '构建有真实 edge 的单股 investment thesis（long-only 或 short-only），可拿去 pitch 给 PM 的完整逻辑；pair / hedge candidate 使用 pair-trade'
description: '构建有真实 edge 的单股 investment thesis（long-only 或 short-only），可拿去 pitch 给 PM 的完整逻辑；pair / hedge candidate 使用 pair-trade'
tags:
  - 'thesis'
  - 'ic-memo'
  - 'conviction'
  - 'buy-side'
  - 'investment-decision'
trigger:
  type: 'keyword'
  keywords:
    - '帮我搭一下 thesis'
    - '单股 thesis'
    - '多头 thesis'
    - '空头 thesis'
    - 'long thesis'
    - 'short thesis'
    - '帮我把 thesis 整理一下'
    - '我有个想法'
    - '帮我成型'
    - '为什么我看多'
    - '为什么我看空'
    - '帮我搭一个 pitch'
  description: '当用户要建立或整理单股 long-only / short-only 投资观点时触发；pair、hedge candidate 或 Long X Short Y 使用 pair-trade'
capabilities:
  generates: '8-section single-name investment thesis with variant view'
  output_format: '800-1500 字 完整逻辑'
  includes:
    - 'catalyst'
    - 'kill-criteria'
    - 'bull-base-bear'
    - 'sizing'
  requirements:
    - 'source links required'
    - 'quantitative support'
    - 'follow CLAUDE.md source policy'
    - 'use pair-trade for Long X Short Y, hedge candidates, and hedged structures'
  journal_first_handoff: 'research-journal or next-step'
artifact_policy:
  save_policy: 'optional_topic_session'
  default_artifact: 'alpha-thesis.md'
  canonical_location: 'topics/[topic-slug]/[YYYY-MM-DD]-[session-slug]/alpha-thesis.md'
  save_trigger: 'save only when user asks to preserve the thesis as session research material; use research-journal only after insight is earned'
workflow:
  stage: 'analysis'
  prerequisites:
    - 'stock-quickread'
    - 'consensus-map when variant-view gap is not yet explicit'
  next_steps:
    - 'primary-research-plan'
    - 'bear-pre-mortem'
    - 'earnings-setup'
    - 'research-journal'
    - 'next-step'
  decision_point: 'conviction 是否真实'
required_sections:
  - 'variant_view_vs_consensus'
  - 'why_gap_exists'
  - 'specific_catalysts_with_timing'
  - 'bull_base_bear_scenarios_with_returns'
  - 'kill_criteria_with_observable_signals'
  - 'sizing_logic'
  - 'key_assumptions_list'
quality_gates:
  anti_patterns:
    - 'no_variant_view'
    - 'qualitative_without_numbers'
    - 'catalysts_are_long_term'
    - 'weak_bear_case'
    - 'empty_kill_criteria'
