name: information-impact
version: 3.0.0
author: buy-side-research-system
namespace: research.equity
summary: Claim check and research relevance filter
description: |
  用于验证新闻、传闻、供应链 claim、行业数据点或专家观点是否可信，
  并判断它是否产生值得继续研究的问题。
trigger:
  keywords:
    - 这个消息靠谱吗
    - 这条新闻怎么看
    - 这个传闻靠谱吗
    - 有没有 source
    - 这个 claim 能不能信
    - 供应链传闻
    - SpaceX 供应链
    - 是不是进了
    - claim check
    - 这条新闻影响什么
    - Goldman 这份报告
    - 刚出的 EIA
    - PMI
    - CPI
    - 今天早报过一遍
  description: 当用户要验证一条信息或传闻是否可信、是否值得继续研究时触发
category: research
tags:
  - information-impact
  - claim-check
  - rumor-verification
  - research-relevance
capabilities:
  - mode: Claim Check
  - mode: Research Relevance
  - output: verdict + source quality + research implication
requires:
  - CLAUDE.md §3 source policy
workflow_dependencies:
  - can_trigger: next-step
  - can_feed: research-journal
