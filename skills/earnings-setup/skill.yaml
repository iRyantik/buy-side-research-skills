name: earnings-setup
version: 1.2.0
author: buy-side-research-system
namespace: research.equity

summary: 财报前后的 setup 和快速决策
description: |
  用于买方研究员在财报前的准备和财报后的快速决策。
  财报前：构建 setup——这单 print 的 risk/reward 是否值得调整仓位
  财报后：快速判断 thesis 是否还成立
  关注的是预期差和事件交易，不是财报数字本身
  
trigger:
  keywords:
    - "下周财报"
    - "earnings setup"
    - "怎么 trade"
    - "刚出了财报"
    - "快速判断 thesis"
    - "这季财报"
    - "print"
  description: "当用户谈到财报窗口的 setup 或后视时触发"

category: research
tags:
  - earnings
  - event-driven
  - catalyst
  - buy-side
  - tactical

capabilities:
  - generates: "Two separate workflows: pre-print setup OR post-print quick read"
  - output_format: "pre: 500-900 字; post: 400-700 字"
  - includes: "consensus vs buy-side bar、decision tree、KPI tracking"
  - post_print_handoff: "thesis_update + decision_entry_trigger + pair_readthrough"

requires:
  - "CLAUDE.md §3 source policy"

prerequisites:
  - "alpha-thesis (expected: catalyst list, assumption checklist)"

workflow_dependencies:
  - "consumes": "alpha-thesis catalyst and assumptions"
  - "feeds_back_to": "alpha-thesis (thesis health update)"
  - "can_trigger": "decision-journal (if action changes)"
  - "can_trigger": "bear-pre-mortem (if thesis severely undermined)"

critical_notes: |
  时效性极高——consensus/IV/股价数据必须标注获取时点
  财报前决策树必须提前写，中间不改
  财报后决策必须立即执行，不要事后追悔
