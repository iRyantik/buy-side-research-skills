metadata_schema_version: 1
name: 'ingest'
id: 'ingest'
display_name: 'Ingest Raw Material'
version: '1.2.0'
system_generation: '3.6.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Convert raw research materials into source-tracked workspace _cache markdown before analysis.'
description: 'Convert raw research materials into source-tracked workspace _cache markdown before analysis.'
tags:
  - 'ingest'
  - 'raw-material'
  - 'document-conversion'
  - 'markdown-cache'
  - 'pdf'
  - 'xlsx'
  - 'pptx'
  - 'docx'
  - 'csv'
  - 'docling'
  - 'pymupdf4llm'
  - 'edgartools'
  - 'akshare'
  - 'edinet-tools'
  - 'dart-fss'
  - 'openesef'
trigger:
  type: 'keyword'
  keywords:
    - 'ingest'
    - 'ingest this'
    - '消化这个文件'
    - '处理这份材料'
    - '转成 markdown'
    - '转换到 cache'
    - '处理 _inbox'
  description: '当用户要把 raw research material 转换成 workspace _cache markdown 时触发'
capabilities:
  modes:
    - 'Dependency Bootstrap / Check'
    - 'Single File Ingest'
    - 'Inbox / Directory Ingest'
    - 'Cache Reuse Check'
    - 'Image Extraction'
    - 'Vision Description (optional)'
  requirements:
    - 'support --check-deps dependency matrix before conversion'
    - 'install dependencies only through explicit opt-in bootstrap script'
    - 'route text-heavy PDFs through PyMuPDF4LLM (fast CPU path); table-heavy PDFs through Docling'
    - 'route SEC filings through EdgarTools readiness plus Docling narrative conversion'
    - 'extract embedded images from PDF/DOCX/PPTX/XLSX with deduplication and size filtering'
    - 'embed extracted images in cache markdown with ![](path) for Claude multimodal reading'
    - 'support optional external vision model API via VISION_ENDPOINT env var or --vision-endpoint'
    - 'scanned PDFs: attempt Docling first, PyMuPDF4LLM fallback; mark precision caveat for Claude Vision review'
    - 'write cache markdown with source metadata header'
    - 'skip existing cache by default unless force is requested'
    - 'auto-move source files from _inbox/ to topics/<topic>/_raw/<category>/ after successful conversion'
    - 'support --category for document classification (filings, transcripts, sellside, industry, irdecks, datasets)'
    - 'auto-infer document category from filename and content'
    - 'strict topic check: block if topic index.md does not exist'
    - 'organize topics/<topic>/_raw/ by document category'
    - 'never move files already under topics/<topic>/_raw/; only move from _inbox/'
    - 'do not produce investment conclusions'
    - 'fail honestly when optional parser dependencies are missing'
artifact_policy:
  save_policy: 'cache_artifact'
  default_artifact: '[source-filename].md'
  canonical_location: 'topics/[topic]/_cache/[source-filename].md'
  save_trigger: 'write cache markdown only after a user provides a source file or directory inside a research workspace'
workflow:
  stage: 'material-ingestion'
  can_follow:
    - 'init-workspace'
  feeds_into:
    - 'information-impact'
    - 'company-primer'
    - 'mechanism-map'
    - 'driver-map'
    - 'financial-model'
    - 'research-journal'
  can_trigger:
    - 'information-impact'
    - 'company-primer'
    - 'mechanism-map'
    - 'driver-map'
quality_gates:
  anti_patterns:
    - 'claiming_conversion_success_when_dependency_missing'
    - 'silent_dependency_install'
    - 'claiming_sec_xbrl_route_without_edgar_identity'
    - 'treating_cache_as_original_source'
    - 'writing_investment_conclusion_during_ingest'
    - 'moving_files_already_under_raw'
    - 'moving_files_not_in_inbox'
    - 'recursive_workspace_ingest_without_explicit_request'
  required_metadata:
    - 'source_path'
    - 'source_sha256'
    - 'source_modified_utc'
    - 'converter'
    - 'converted_at_utc'
    - 'precision'
    - 'precision_level'
    - 'document_type'
    - 'route'
    - 'page_count'
    - 'table_count'
  runtime_assets:
    - 'scripts/ingest.py'
    - 'scripts/ingest_xlsx.py'
    - 'scripts/ingest_table_crosscheck.py'
    - 'scripts/bootstrap-ingest-deps.ps1'
    - 'assets/requirements-ingest.txt'
