name: driver-map
version: 3.2.0
author: buy-side-research-system
namespace: research.equity

summary: Map reported business buckets to real business substance and model drivers
description: |
  用于拆解 revenue / margin / backlog / price-volume-mix driver，
  将公司披露口径、segment bucket 或怪异业务分类翻译成真实业务和可建模 driver。
  不做 DCF/comps，不生成 workbook，不写完整 thesis。

trigger:
  keywords:
    - "拆 driver"
    - "收入怎么拆"
    - "revenue driver"
    - "segment driver"
    - "bucket 为什么怪"
    - "这家公司靠什么增长"
    - "backlog 怎么进收入"
    - "price volume mix"
    - "margin driver"
    - "weird bucket"
    - "reported bucket"
    - "segment bucket"
    - "披露口径异常"
    - "业务实质"
    - "model-driver gap"
  description: "当用户要拆公司或业务的收入、利润率、backlog、price/volume/mix driver，或解释怪异披露口径时触发"

category: research
tags:
  - driver-map
  - mechanism-map
  - revenue-driver
  - margin-driver
  - segment-drivers
  - revenue-split
  - backlog-conversion
  - price-volume-mix
  - model-driver-gap
  - senior-analyst-radar

capabilities:
  - mode: "Driver Map"
  - output_path: "topics/[topic_type]/[topic-slug]/[YYYY-MM-DD]-[session-slug]/driver-map.md when user asks to save"
  - maps: "reported bucket to business reality"
  - maps: "business reality to model driver"
  - flags_model_driver_gap: true
  - no_dcf_or_comps: true
  - no_workbook_editing: true

requires:
  - "CLAUDE.md §3 source policy"
  - "META-SKILL.md skill authoring rules"

workflow_dependencies:
  - "can_follow": "mechanism-map"
  - "can_follow": "stock-quickread"
  - "can_follow": "information-impact"
  - "can_feed": "financial-model"
  - "can_feed": "alpha-thesis"
  - "can_feed": "peer-deep-dive"
  - "can_feed": "pair-trade"
  - "can_feed": "research-journal"
  - "can_trigger": "next-step"

anti_patterns:
  - "repeating reported segment names without business reality"
  - "inventing undisclosed revenue drivers"
  - "treating theme association as direct revenue driver"
  - "doing DCF or comps inside driver-map"
  - "using historical CAGR as the default driver"
  - "omitting source/as-of for segment, KPI, backlog, margin, or price-volume-mix claims"
