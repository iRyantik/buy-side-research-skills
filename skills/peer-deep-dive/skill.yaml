metadata_schema_version: 1
name: 'peer-deep-dive'
id: 'peer-deep-dive'
display_name: 'Peer Deep Dive'
version: '1.0.2'
system_generation: '3.4.0-dev'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
summary: '并行深入研究 3-8 家同业公司，产出共享行业 lens + cross-cut 矛盾/共识/错配信号 + 研究排序'
description: '并行深入研究 3-8 家同业公司，产出共享行业 lens + cross-cut 矛盾/共识/错配信号 + 研究排序'
tags:
  - 'peer-deep-dive'
  - 'cross-cut'
  - 'horizontal-research'
  - 'buy-side'
  - 'equity-research'
  - 'industry-lens'
trigger:
  type: 'keyword'
  keywords:
    - '这几家都值得看'
    - '这几家公司一起看'
    - '这几家一起看下'
    - '这几家拉出来做横向研究'
    - '并行覆盖'
    - '这几家并行研究'
    - '这几家一起研究'
    - 'deep dive 这几家'
    - '帮我一起研究这几家'
  description: '当用户已选定多家公司、要并行深入研究时触发'
capabilities:
  generates: 'structured cross-company analysis: industry lens + KPI matrix + differential profiles + cross-cut insights + research ranking'
  output_format: '2500-5000 字 + 2-3 张数据表'
  time_estimate: '60-90 minutes'
  requirements:
    - '遵守 CLAUDE.md source policy'
    - '每一条事实声明必须附带可点击的 source link'
    - '矩阵必须有 Source 列'
    - 'Cross-cut 必须有具体引语和数字对比'
    - '必须输出 cluster / relative mismatch 判断'
  company_limit:
    min: 3
    max: 8
    overflow_action: '先自由对话预筛，或按子行业 / business model 分子组'
artifact_policy:
  save_policy: 'optional_topic_session'
  default_artifact: 'peer-deep-dive.md'
  canonical_location: 'topics/[topic_type]/[topic-slug]/[YYYY-MM-DD]-[session-slug]/peer-deep-dive.md'
  save_trigger: 'save only when user asks to preserve the peer work as session research material'
workflow:
  stage: 'deep-dive'
  prerequisites:
    - '3-8 selected companies'
  next_steps:
    - 'stock-quickread'
    - 'alpha-thesis'
  feeds_into:
    - 'stock-quickread (按排序执行)'
    - 'alpha-thesis (高优先级候选)'
    - 'research-journal'
    - 'next-step'
  decision_point: '哪家公司优先级最高、资源如何分配'
required_sections:
  - 'task_definition'
  - 'industry_lens_with_macro_regime'
  - 'kpi_matrix_2A_and_2B'
  - 'company_differential_profiles'
  - 'cross_cut_contradiction_consensus_mispricing_extremes'
  - 'research_ranking_and_resource_allocation'
  - 'cross_company_key_questions'
  - 'next_steps'
quality_gates:
  anti_patterns:
    - 'N 份独立 quickread 拼贴'
    - '行业入门科普'
    - '管理层简历'
    - '无 cross-cut 信号'
    - '表格无 Source 列'
    - '含糊的排序'
    - 'Thesis 苗头写''看情况'''
  data_requirements:
    - '行业 lens（当前 regime + capital cycle + base rate）'
    - '通用维度 KPI 矩阵（市值、收入、margin、ROIC、leverage 等）'
    - '行业特定维度 KPI 矩阵（从模板加载）'
    - '各公司 differential profile（只列与同业差异）'
    - 'cross-cut 矛盾/共识/估值错配/极端值四节'
    - '优先级排序 + 时间分配 + 下一步研究问题'
    - '所有数据、KPI、引语必须附带 source link'
