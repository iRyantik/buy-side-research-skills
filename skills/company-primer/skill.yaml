metadata_schema_version: 1
name: 'company-primer'
id: 'company-primer'
display_name: 'Company Primer'
version: '1.0.0'
system_generation: '3.4.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
summary: 'Build source-backed company foundations, business evolution maps, and disclosure evolution audits before driver, thesis, peer, or model work.'
description: 'Build source-backed company foundations, business evolution maps, and disclosure evolution audits before driver, thesis, peer, or model work.'
tags:
  - 'company-primer'
  - 'company-analysis'
  - 'business-history'
  - 'business-evolution'
  - 'segment-history'
  - 'kpi-history'
  - 'disclosure-map'
  - 'disclosure-evolution'
  - 'source-reconciliation'
trigger:
  type: 'keyword'
  keywords:
    - 'company primer'
    - '公司 primer'
    - '深度研究这家公司'
    - '这家公司到底做什么'
    - '这家公司业务是什么'
    - '公司基础'
    - '业务演变'
    - '披露口径变化'
    - 'segment 口径'
    - 'KPI 口径'
    - 'recast'
    - 'rename'
  description: '当用户需要在 quickread 之后、driver/thesis/model 之前打牢公司业务基础和披露演变时触发'
capabilities:
  modes:
    - 'Foundation Primer'
    - 'Business Evolution Audit'
    - 'Disclosure Evolution Audit'
  output_path: 'topics/[topic_type]/[topic-slug]/[YYYY-MM-DD]-[session-slug]/company-primer.md when user asks to save'
  requirements:
    - 'map current business reality without writing sell-side company history'
    - 'source every product, customer, segment, KPI, M&A, divestiture, recast, or rename claim'
    - 'flag segment and KPI comparability breaks'
    - 'route mechanism and know-how gaps to mechanism-map'
    - 'route driver and model-driver gaps to driver-map'
    - 'route source conflicts to information-impact'
    - 'do not perform DCF, comps, or full thesis work'
artifact_policy:
  save_policy: 'optional_topic_session'
  default_artifact: 'company-primer.md'
  canonical_location: 'topics/[topic_type]/[topic-slug]/[YYYY-MM-DD]-[session-slug]/company-primer.md'
  save_trigger: 'save only when user asks to preserve the company primer as session research material'
workflow:
  stage: 'company-foundation'
  can_follow:
    - 'stock-quickread'
    - 'next-step'
    - 'information-impact'
  feeds_into:
    - 'driver-map'
    - 'mechanism-map'
    - 'peer-deep-dive'
    - 'alpha-thesis'
    - 'financial-model'
    - 'research-journal'
  can_trigger:
    - 'driver-map'
    - 'mechanism-map'
    - 'information-impact'
quality_gates:
  anti_patterns:
    - 'sell_side_company_history'
    - 'management_bios'
    - 'unsourced_product_or_customer_claims'
    - 'segment_recast_treated_as_continuous_history'
    - 'driver_map_work_done_inside_primer'
  data_requirements:
    - 'source_links_or_source_descriptions'
    - 'as_of_dates_for_business_and_disclosure_claims'
    - 'segment_or_kpi_comparability_flags'
    - 'downstream_handoff_when_driver_or_mechanism_gap_blocks_judgment'
