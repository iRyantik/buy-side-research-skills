metadata_schema_version: 1
name: 'new-session'
id: 'new-session'
display_name: 'New Session'
version: '2.0.0'
system_generation: '3.7.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Create or locate topic roots, resolve dated research result filenames, and lightly update topic indexes.'
description: 'Create or locate long-lived topic roots, resolve dated Markdown result paths, and lightly update topic indexes without doing research or recommending a next research skill.'
tags:
  - 'new-session'
  - 'topic-root'
  - 'dated-result'
  - 'save-path'
  - 'index-touch'
  - 'operations'
trigger:
  type: 'keyword'
  keywords:
    - 'new session'
    - 'create topic'
    - 'new topic'
    - 'open topic'
    - 'resolve save path'
    - 'where should this artifact be saved'
    - 'update topic index'
    - 'index touch'
  description: 'Trigger when the user wants to create or locate a topic root, resolve a dated artifact filename, or lightly update a topic index.'
capabilities:
  modes:
    - 'New Topic Root'
    - 'Resolve Dated Result Path'
    - 'Index Touch'
  requirements:
    - 'create or locate topics/[topic-namespace]/[topic-slug]/'
    - 'treat topic root as the long-lived container for dated research result files'
    - 'support topic namespace convention: company, industry, theme, pair'
    - 'ensure topic index.md exists without overwriting existing content'
    - 'resolve only the requested dated result path, not every possible research output'
    - 'use topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-[artifact].md for research Markdown results'
    - 'append -2, -3, and later suffixes when the dated result file already exists'
    - 'update only dated result links, current question, open questions, and related artifacts in index.md'
    - 'create full topic scaffold: _inbox/, _raw/{filings,transcripts,sellside,industry,irdecks,datasets}/, _cache/, _models/'
    - 'do not precreate research output markdown files'
    - 'do not create per-research subdirectories'
    - 'do not write research conclusions or earned insight'
    - 'do not recommend next research skill'
    - 'do not create v2 state folders'
artifact_policy:
  save_policy: 'topic_scaffold'
  default_artifact: 'topic root + dated result file'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-[artifact].md'
  save_trigger: 'create or locate a topic root only when the user asks to open a topic, resolve a save path, or touch a topic index'
workflow:
  stage: 'topic-root-setup'
  can_follow:
    - 'init-workspace'
    - 'user-save-request'
    - 'research-artifact-save-request'
  feeds_into:
    - 'industry-quickread'
    - 'consensus-map'
    - 'primary-research-plan'
    - 'company-primer'
    - 'mechanism-map'
    - 'driver-map'
    - 'stock-quickread'
    - 'peer-deep-dive'
    - 'alpha-thesis'
    - 'bear-pre-mortem'
    - 'earnings-setup'
    - 'cross-market-compare'
    - 'pair-trade'
    - 'candidate-screener'
    - 'research-journal'
  can_trigger:
    - 'research-journal'
quality_gates:
  anti_patterns:
    - 'writing_research_conclusions'
    - 'recommending_next_research_skill'
    - 'overwriting_existing_index'
    - 'overwriting_existing_dated_result'
    - 'creating_v2_state_folders'
    - 'writing_cache_as_topic_artifact'
    - 'inventing_complex_directory_tree'
    - 'failing_to_create_topic_scaffold'
    - 'precreating_research_output_files'
    - 'creating_per_research_subdirectories'
  required_paths:
    - 'topics/[topic-namespace]/[topic-slug]/index.md'
    - 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-[artifact].md'
