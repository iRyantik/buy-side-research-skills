capabilities:
  modes:
  - Candidate Mining
  writes: industry/<industry>/companies/<ticker>/YYYY-MM-DD-<artifact>.md
  feeds_into:
  - stock-quickread
  - peer-deep-dive
  - research-journal
  - 
  requirements:
  - follow CLAUDE.md source policy
  - market-snapshot fields default to topic-local evidence cache / financial-data
    then trusted-market-bridge then web fallback
  - may use trusted-market-bridge for market_quote valuation_snapshot price_action
    fx_snapshot adr_ah_premium and market_screen
  - treat market_screen as a screening convenience layer, not thesis truth or business-fact
    authority
  - scope_restricted unsupported_market ambiguous and unavailable may fall back to
    existing web or internet source logic unless longbridge_only is explicitly requested
  - do not relax borrow conversion accounting-basis or share-class sourcing discipline
    because bridge evidence exists
  - source every business linkage
  - score candidates on purity growth valuation discovery edge and tradability
  - separate Top Ideas Watchlist Already Priced and Rejects/Value Traps
  - treat market-undiscovered claims as proxy-based hypotheses not facts
  - read `## Focus` 区 when present and treat the current user request as the overriding lens
  - separate outbound screening from inbound claim checking
  - parallel_evidence_spawn_default for source collection
  - sub-agent outputs must be evidence_cards_only
  - main_agent_synthesis_required for tiering and recommendations
  - url_claim_spot_check_required before using sub-agent sources
artifact_policy:
  save_policy: default_topic_result
  default_artifact: candidate-screener.md
  canonical_location: industry/<industry>/companies/<ticker>/YYYY-MM-DD-<artifact>.md
  naming_mode: optional_qualifier
  save_trigger: save sourced candidate funnels by default unless user explicitly asks
    for conversation-only brainstorming
