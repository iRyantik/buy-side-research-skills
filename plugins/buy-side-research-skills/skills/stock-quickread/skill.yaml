metadata_schema_version: 1
name: 'stock-quickread'
id: 'stock-quickread'
display_name: 'Stock Quickread'
version: '1.2.0'
system_generation: '4.5.4'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Run a fast sourced first pass on an unfamiliar company and decide whether to dig deeper.'
description: 'Run a fast sourced first pass on an unfamiliar company and decide whether to dig deeper.'
tags:
  - 'quickread'
  - 'company-analysis'
  - 'buy-side'
  - 'new-coverage'
  - 'primer'
  - 'fixed-layers'
trigger:
  type: 'keyword'
  keywords:
    - 'stock-quickread'
    - 'quickread'
    - '帮我看一下这家公司'
    - '这家公司是做什么的'
    - '我对这家公司不熟'
    - '压缩成关键点'
  description: '当用户想快速理解一家陌生公司并判断是否继续研究时触发'
capabilities:
  archetype: 'Primer'
  fixed_layers:
    - 'Foundation Layer'
    - 'Interpretation Layer'
    - 'Research Layer'
    - 'Decision Layer'
  generates: 'layer-first company quickread with business reality, market framing, and next-step routing'
  output_format: 'markdown-first company quickread with optional visual companion'
  time_estimate: '30 minutes'
  includes:
    - 'Business Type + Market Phase'
    - 'Reasonable Track vs FOMO Track'
    - 'Business Snapshot'
    - 'Financial Snapshot'
    - 'Capital Cycle'
    - 'Market Lens'
    - 'What The Market Is Pricing'
    - 'Valuation Framing'
    - 'Key Catalysts'
    - 'Risks'
    - 'next-step routing'
  requirements:
    - 'source links required'
    - 'follow CLAUDE.md source policy'
    - 'market-snapshot fields default to topic-local evidence cache / financial-data then trusted-market-bridge then web fallback'
    - 'may use trusted-market-bridge for market_quote valuation_snapshot price_action consensus and financial_snapshot'
    - 'financial_snapshot from trusted-market-bridge is quick context only, not company-truth or financial-data replacement'
    - 'route company foundation and disclosure evolution gaps to company-primer'
    - 'route systematic consensus and priced-in analysis to consensus-map'
    - 'route driver decomposition gaps to driver-map'
    - 'markdown is the primary artifact and research-viz is companion-only'
    - 'upgrade to research-viz only when visual density exceeds markdown readability'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for quickread verdict and routing'
    - 'sub-agent_opt_in_only unless the user explicitly requests sub-agent / delegate / parallel evidence collection'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'stock-quickread.md'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-stock-quickread.md'
  naming_mode: 'plain'
  save_trigger: 'save only when user asks to preserve the quickread as dated topic research result'
workflow:
  stage: 'discovery'
  next_steps:
    - 'company-primer'
    - 'driver-map'
    - 'consensus-map'
    - 'alpha-thesis'
    - 'research-viz'
  decision_point: 'whether the name deserves deeper research time'
required_layers:
  - 'Foundation Layer'
  - 'Interpretation Layer'
  - 'Research Layer'
  - 'Decision Layer'
quality_gates:
  anti_patterns:
    - 'flow_water_account_style'
    - 'management_bios'
    - '5_year_historical_financials'
    - 'industry_intro_textbooks'
    - 'missing_business_type_or_market_phase'
    - 'visual_companion_without_base_markdown'
  data_requirements:
    - 'financial_data_table'
    - 'capital_cycle_metrics'
    - 'empirical_drivers'
    - 'source_links'
