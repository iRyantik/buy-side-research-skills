metadata_schema_version: 1
name: 'coverage-monitor'
id: 'coverage-monitor'
display_name: 'Coverage Monitor'
version: '1.0.0'
system_generation: '5.38.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Generate four-tab dashboard daily coverage briefs and optional intraday material-event alerts from workspace coverage state.'
description: 'Generate dashboard-style daily coverage briefs with Movers, Core Watch, Industry Tape, Universe, and email delivery.'
tags:
  - 'coverage-monitor'
  - 'daily-brief'
  - 'intraday-alerts'
  - 'email'
  - 'operations'
trigger:
  type: 'keyword'
  keywords:
    - 'coverage monitor'
    - 'daily coverage brief'
    - 'monitor my coverage'
    - 'send today coverage brief'
    - '持仓监控'
    - '覆盖日报'
    - '盘中提醒'
  description: 'Trigger when the user wants daily monitoring or intraday alerts for workspace coverage.'
capabilities:
  modes:
    - 'doctor'
    - 'normalize-coverage'
    - 'daily'
    - 'intraday'
  requirements:
    - 'use COVERAGE.md as the coverage source of truth'
    - 'read the ## Coverage table in COVERAGE.md as the ticker/company/coverage-status source of truth'
    - 'use industry/*/companies/* only to supplement artifact metadata when coverage rows exist'
    - 'generate the four-tab daily dashboard: Movers, Core Watch, Industry Tape, Universe'
    - 'surface coverage workflow gaps such as deep-work Core Coverage review due'
    - 'intraday alerts default to Core Watch names only'
    - 'email delivery uses workspace .env or environment SMTP_* plus COVERAGE_EMAIL_TO'
    - 'daily email sends a summary body plus full HTML attachment'
    - 'missing market data or delivery credentials must fail honestly'
artifact_policy:
  save_policy: 'cache_artifact'
  default_artifact: 'daily-coverage-brief.md'
  canonical_location: 'reports/coverage-monitor/YYYY-MM-DD-daily-coverage-brief.md'
  save_trigger: 'write report files only for daily mode without --dry-run; intraday writes dedupe state only when alerts are sent'
