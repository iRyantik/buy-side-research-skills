metadata_schema_version: 1
name: update-agent-runtime
id: update-agent-runtime
display_name: Update Agent Runtime
version: 2.0.0
system_generation: 6.0.0
author: buy-side-research-system
namespace: research.equity
category: operations
summary: Update installed hosts and transactionally sync a managed workspace runtime.
description: "Update installed host runtimes from a packaged release payload and transactionally sync the current workspace."
trigger:
  type: keyword
  keywords: [update-agent-runtime, update plugin runtime, 更新插件到最新版本, 修复 workspace 运行时]
capabilities:
  modes: [All Installed Hosts, Workspace Runtime Sync, Plan Only]
  requirements:
    - use the plugin release runtime payload as source of truth
    - preserve old host versions for rollback
    - preserve conflicts and user files
    - tell the user to restart the session after update
quality_gates:
  anti_patterns:
    - recursive_skill_asset_copy
    - global_force_overwrite
    - deleting_unknown_files
  required_checks:
    - host pointers resolved
    - workspace plan reviewed
    - runtime-manager verify passes
