metadata_schema_version: 1
name: 'mechanism-insight'
id: 'mechanism-insight'
display_name: 'Mechanism Insight'
version: '1.0.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'foundation'
summary: 'Deep-dive a single industry mechanism engineering principle or equipment chain with value-capture insight.'
description: "Deep-dive a single industry mechanism engineering principle or equipment chain — explain how it works and where value is captured."
tags:
  - 'mechanism-insight'
  - 'industry-mechanism'
  - 'engineering-principle'
  - 'equipment-chain'
  - 'process-flow'
  - 'know-how-gap'
  - 'value-capture'
  - 'senior-analyst-radar'
  - 'deep-dive'
trigger:
  type: 'keyword'
  keywords:
    - 'mechanism-insight'
    - 'mechanism insight'
    - 'mechanism deep dive'
    - 'mechanism-insight'
    - 'mechanism map'
    - '行业机制'
    - '工程原理'
    - '设备链条'
    - '工艺流程'
    - 'know-how gap'
    - '术语解释'
    - 'bottleneck'
    - 'control point'
    - 'value capture'
    - '机制怎么运作'
    - '设备怎么连接'
    - '瓶颈在哪'
    - '深挖机制'
    - '这个机制怎么看'
  description: '当用户要深挖单个行业机制、工程原理、设备链条或工艺，并需要知道谁在捕获价值时触发。不是行业全景（→industry-landscape），不是零基础科普（→teach-in）。'
capabilities:
  modes:
    - 'Mechanism Explainer'
    - 'Mechanism-to-Research Map'
    - 'Mixed Mode'
  output_path: 'industry/[industry-slug]/[YYYY-MM-DD]-mechanism-insight-[qualifier].md when user asks to save'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'explain terms, equipment chains, and process flows'
    - 'include a lightweight flow map for complex mechanisms'
    - 'map mechanism implications to value capture and driver-map links'
    - 'must include product/equipment photos'
    - 'do not perform DCF or comps'
    - 'do not write full thesis'
    - 'do not do zero-to-one physics education (→teach-in)'
    - 'do not do full industry landscape (→industry-landscape)'
    - 'sub-agent_opt_in_only for parallel image downloads'
    - 'main_agent_synthesis_required for mechanism implication and value-capture conclusion'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'mechanism-insight.md'
  canonical_location: 'industry/[industry-slug]/[YYYY-MM-DD]-mechanism-insight-[qualifier].md'
  naming_mode: 'required_qualifier'
  save_trigger: 'save only when user asks to preserve mechanism insight as dated topic research result'
workflow:
  stage: 'research-primitive'
  can_follow:
    - 'teach-in'
    - 'industry-landscape'
    - 'information-impact'
    - 'stock-quickread'
    - 'next-step'
  feeds_into:
    - 'driver-map'
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
    - 'model-update'
    - 'alpha-thesis'
    - 'peer-deep-dive'
    - 'pair-trade'
    - 'research-journal'
  can_trigger:
    - 'next-step'
  decision_point: '这个机制最重要的投研含义是什么，下一步应该拆 driver 还是形成 thesis'
quality_gates:
  anti_patterns:
    - 'encyclopedia_without_value_capture'
    - 'capability_as_adoption'
    - 'technical_importance_as_pricing_power'
    - 'no_flow_diagram'
    - 'no_product_photo'
    - 'doing_industry_landscape_level_panorama'
    - 'doing_teach_in_level_physics_education'
    - 'doing_dcf_or_valuation'
  data_requirements:
    - 'terms_table_with_boundaries'
    - 'flow_diagram'
    - 'bottleneck_analysis'
    - 'value_capture_table'
    - 'research_readthrough'
    - 'what_not_to_infer'
    - 'routing_handoff'
    - 'product_equipment_photos'
