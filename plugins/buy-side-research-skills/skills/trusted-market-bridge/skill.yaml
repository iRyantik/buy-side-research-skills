metadata_schema_version: 1
name: 'trusted-market-bridge'
id: 'trusted-market-bridge'
display_name: 'Trusted Market Bridge'
version: '1.0.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Fetch A-share Hong Kong and US market evidence via Longbridge for market data price action FX ADR/AH premium filings news consensus financial snapshots and market-screen signals.'
description: 'Fetch A-share Hong Kong and US market evidence via Longbridge for market data price action FX ADR/AH premium filings news consensus financial snapshots and market-screen signals.'
tags:
  - 'trusted-market-bridge'
  - 'market-bridge'
  - 'longbridge'
  - 'market-data'
  - 'price-data'
  - 'quote'
  - 'valuation'
  - 'fx'
  - 'adr-premium'
  - 'ah-premium'
  - 'filings'
  - 'consensus'
  - 'news'
  - 'financial-snapshot'
  - 'market-screen'
  - 'operations'
trigger:
  type: 'keyword'
  keywords:
    - 'trusted-market-bridge'
    - 'market bridge'
    - 'longbridge bridge'
    - 'longbridge market data'
    - 'longbridge filings'
    - 'longbridge consensus'
    - 'longbridge fx'
    - 'longbridge market screen'
    - 'longbridge anomaly'
    - 'longbridge scanner'
    - 'longbridge ADR premium'
    - 'longbridge AH premium'
    - 'market data bridge'
    - 'price data bridge'
    - '用 longbridge 拉市场数据'
    - '用 longbridge 拉价格数据'
    - '用 longbridge 拉 filings'
    - '用 longbridge 拉 consensus'
    - '用 longbridge 拉汇率'
    - '用 longbridge 拉 ADR 溢价'
    - '用 longbridge 拉 AH 溢价'
  description: '当用户要显式拉取 Longbridge 市场数据、价格数据、FX、ADR/AH premium、filings、news、consensus 或让其他 research skill 借用统一 bridge 时触发'
capabilities:
  modes:
    - 'Direct Evidence Bundle'
    - 'Research Skill Assist'
  supported_markets:
    - 'US'
    - 'HK'
    - 'SH'
    - 'SZ'
  supported_domains:
    - 'market_quote'
    - 'price_action'
    - 'valuation_snapshot'
    - 'kline_snapshot'
    - 'fx_snapshot'
    - 'adr_ah_premium'
    - 'news'
    - 'filings'
    - 'consensus'
    - 'financial_snapshot'
    - 'market_screen'
  current_account_empirical_support:
    working_domains:
      - 'market_quote'
      - 'price_action'
      - 'valuation_snapshot'
      - 'kline_snapshot'
      - 'fx_snapshot'
      - 'adr_ah_premium'
      - 'consensus'
      - 'financial_snapshot'
    scope_restricted_domains:
      - 'news'
      - 'filings'
    not_yet_live_checked_domains:
      - 'market_screen'
    working_commands:
      - 'quote'
      - 'static'
      - 'intraday'
      - 'calc-index'
      - 'valuation'
      - 'exchange-rate'
      - 'consensus'
      - 'forecast-eps'
      - 'financial-report'
      - 'company'
      - 'adr-premium'
      - 'ah-premium'
    scope_restricted_commands:
      - 'news'
      - 'filing'
      - 'topic'
  requirements:
    - 'keep Longbridge as provider-derived evidence, not company-disclosed fact'
    - 'act as the default trusted third-party layer for market-snapshot fields after topic-local evidence cache and financial-data'
    - 'preserve provider, symbol, market, as-of, and fallback provenance'
    - 'use [LBG1](https://longbridge.example.com/quote/NVDA.US) style clickable source anchors for bridge-derived evidence'
    - 'treat market_screen as a convenience screening layer rather than company-truth authority'
    - 'reject unsupported domains and unsupported markets honestly'
    - 'return scope_restricted when the current Longbridge account lacks authorization for an otherwise supported domain'
    - 'in auto mode scope_restricted should fall back to existing web or internet market-source logic and be disclosed in final resources only'
    - 'fallback to existing buy-side logic when the market is unsupported or Longbridge is unavailable unless the user explicitly asks for longbridge_only'
artifact_policy:
  save_policy: 'none'
  default_artifact: 'conversation-only'
  canonical_location: 'conversation-only'
  save_trigger: 'does not save research artifacts by default; returns an evidence bundle in the conversation unless the user explicitly asks a research skill to save downstream output'
workflow:
  stage: 'market-data-assist'
  can_follow:
    - 'user-direct-market-request'
    - 'consensus-map'
    - 'earnings-setup'
    - 'peer-deep-dive'
    - 'pair-trade'

    - 'stock-quickread'
    - 'candidate-screener'
    - 'alpha-thesis'
    - 'bear-pre-mortem'
    - 'industry-landscape'
  feeds_into:
    - 'consensus-map'
    - 'earnings-setup'
    - 'peer-deep-dive'
    - 'pair-trade'

    - 'stock-quickread'
    - 'candidate-screener'
    - 'alpha-thesis'
    - 'bear-pre-mortem'
    - 'industry-landscape'
  can_trigger: []
quality_gates:
  anti_patterns:
    - 'writing company facts from provider snapshots as if they were primary disclosure'
    - 'pretending unsupported markets are covered by Longbridge'
    - 'hiding scope restrictions inside generic unavailable failures'
    - 'dropping_provider_or_as_of_metadata'
    - 'treating_financial_snapshot_as_source_of_record_actuals'
    - 'treating_market_screen_as_business_fact_truth'
  required_checks:
    - 'supported_market_check'
    - 'supported_domain_check'
    - 'scope_restriction_check'
    - 'provider_and_as_of_present'
    - 'fallback_or_failure_reason_present'
