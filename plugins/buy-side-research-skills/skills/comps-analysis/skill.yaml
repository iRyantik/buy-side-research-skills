metadata_schema_version: 1
name: 'comps-analysis'
id: 'comps-analysis'
display_name: 'Comps Analysis'
version: '1.1.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'deep-work'
summary: 'Build comparable company valuation workbooks with peer multiples and operating metrics.'
description: "Build comparable company valuation workbooks with peer multiples and operating metrics."
tags:
  - comps
  - peer-multiples
  - relative-valuation
  - xlsx
trigger:
  type: 'keyword'
  keywords:
    - 'comps'
    - 'comparable companies'
    - 'peer multiples'
    - 'relative valuation'
    - '估值对比'
    - '可比公司'
  description: 'Use when the user wants comparable company analysis, peer multiples, or relative valuation.'
capabilities:
  modes:
    - 'peer set valuation'
    - 'multiple benchmarking'
    - 'operating metric comparison'
    - 'outlier analysis'
    - 'model_sub_agent_protocol'
  consumes:
    - 'financial-data'
    - 'driver-map'
    - '3-statement-model'
  preferred_inputs:
    - '_cache/financial-data/financial-data-summary.md'
    - '_cache/financial-data/internal/actuals-resolved.json'
    - '_cache/financial-data/internal/evidence-pack.json'
    - '_cache/driver-map/driver-map.md'
    - '_cache/driver-map/internal/driver-map.json'
    - '_models/<ticker>-3statement-model.xlsx'
  output_path: 'industry/<industry>/_models/[ticker]-comps-analysis.xlsx'
  requirements:
    - 'Prefer source-tracked actuals and driver-map business treatment before external or manual data.'
    - 'Document differences between qualitative peer universe and valuation peer set.'
    - 'Do not mix provider-normalized review data with model-ready actuals without visible flags.'
    - 'main_agent_workbook_ownership_required'
    - 'source_map_and_completeness_check_required'
    - 'no_final_valuation_or_workbook_delivery_by_sub-agent'
    - 'no_missing_or_unmapped_actuals_as_zero'
artifact_policy:
  save_policy: 'external_workbook'
  default_artifact: '<ticker>-comps-analysis.xlsx'
  canonical_location: 'industry/<industry>/_models/[ticker]-comps-analysis.xlsx'
  save_trigger: 'write workbook only when the user asks for comps output or provides a workbook target'
workflow:
  stage: 'valuation'
  can_follow:
    - 'financial-data'
    - 'driver-map'
    - '3-statement-model'
    - 'peer-deep-dive'

  feeds_into:
    - 'dcf-model'
    - 'model-update'
    - 'alpha-thesis'
    - 'research-journal'
  can_trigger:
    - 'dcf-model'
    - 'model-update'
quality_gates:
  anti_patterns:
    - 'Do not let peer availability define the business peer set without explanation.'
    - 'Do not compare multiples across inconsistent fiscal periods, currencies, or share classes.'
    - 'Do not hide outlier exclusions or negative-denominator multiple handling.'
