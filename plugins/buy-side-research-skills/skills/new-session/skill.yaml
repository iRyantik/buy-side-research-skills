metadata_schema_version: 1
name: 'new-session'
id: 'new-session'
display_name: 'New Session'
version: '2.1.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Create or locate topic roots, prepare topic inboxes, resolve dated research result filenames, and lightly update topic indexes.'
description: 'Create or locate long-lived topic roots with index.md and _inbox only, resolve dated Markdown result paths, and lightly update topic indexes without doing research or creating raw/cache/model folders.'
tags:
  - 'new-session'
  - 'topic-root'
  - 'topic-inbox'
  - 'dated-result'
  - 'save-path'
  - 'index-touch'
  - 'operations'
trigger:
  type: 'keyword'
  keywords:
    - 'new session'
    - 'create topic'
    - 'new topic'
    - 'open topic'
    - 'resolve save path'
    - 'where should this artifact be saved'
    - 'update topic index'
    - 'index touch'
  description: 'Trigger when the user wants to create or locate a topic root, prepare the topic inbox, resolve a dated artifact filename, or lightly update a topic index.'
capabilities:
  modes:
    - 'New Topic Root'
    - 'Resolve Dated Result Path'
    - 'Index Touch'
  requirements:
    - 'create or locate topics/[topic-namespace]/[topic-slug]/'
    - 'ensure topics/[topic-namespace]/[topic-slug]/index.md exists without overwriting existing content'
    - 'ensure topics/[topic-namespace]/[topic-slug]/_inbox/ exists'
    - 'do not create _raw/, _cache/, or _models/'
    - 'support topic namespace convention: company, industry, theme, pair'
    - 'treat topic root as the long-lived container for dated research result files'
    - 'use topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-[artifact].md for research Markdown results'
    - 'use [YYYY-MM-DD]-[company-slug]-[artifact].md for single-company research saved inside industry or theme workbench topics'
    - 'append -2, -3, and later suffixes when the dated result file already exists'
    - 'update only dated result links, current question, open questions, related topics, and promotion provenance in index.md'
    - 'do not precreate research output markdown files'
    - 'do not create per-research subdirectories'
    - 'do not write research conclusions or earned insight'
    - 'do not recommend next research skill'
artifact_policy:
  save_policy: 'topic_scaffold'
  default_artifact: 'topic root + inbox + dated result file'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-[artifact].md'
  save_trigger: 'create or locate a topic root only when the user asks to open a topic, resolve a save path, or touch a topic index'
workflow:
  stage: 'topic-root-setup'
  can_follow:
    - 'init-workspace'
    - 'user-save-request'
    - 'research-artifact-save-request'
  feeds_into:
    - 'ingest'
    - 'promote-company'
    - 'industry-quickread'
    - 'consensus-map'
    - 'primary-research-plan'
    - 'company-primer'
    - 'mechanism-map'
    - 'driver-map'
    - 'stock-quickread'
    - 'peer-deep-dive'
    - 'alpha-thesis'
    - 'bear-pre-mortem'
    - 'earnings-setup'
    - 'cross-market-compare'
    - 'pair-trade'
    - 'candidate-screener'
    - 'research-journal'
  can_trigger:
    - 'research-journal'
quality_gates:
  anti_patterns:
    - 'writing_research_conclusions'
    - 'recommending_next_research_skill'
    - 'overwriting_existing_index'
    - 'overwriting_existing_dated_result'
    - 'creating_raw_cache_or_models_from_new_session'
    - 'precreating_research_output_files'
    - 'creating_per_research_subdirectories'
    - 'writing_cache_as_topic_artifact'
    - 'moving_company_files_in_new_session'
  required_paths:
    - 'topics/[topic-namespace]/[topic-slug]/index.md'
    - 'topics/[topic-namespace]/[topic-slug]/_inbox/'
    - 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-[artifact].md'
