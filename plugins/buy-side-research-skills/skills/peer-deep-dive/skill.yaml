metadata_schema_version: 1
name: 'peer-deep-dive'
id: 'peer-deep-dive'
display_name: 'Peer Deep Dive'
version: '1.1.0'
system_generation: '4.5.4'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'deep-work'
summary: 'Compare companies in one industry with sourced KPI matrices and research ranking.'
description: 'Compare companies in one industry with sourced KPI matrices and research ranking.'
tags:
  - 'peer-deep-dive'
  - 'cross-cut'
  - 'horizontal-research'
  - 'compare'
  - 'buy-side'
trigger:
  type: 'keyword'
  keywords:
    - '这几家公司一起看'
    - '并排研究'
    - 'peer deep dive'
    - '帮我一起研究这几家'
  description: '当用户已经选定多家公司并要做横向深度比较时触发'
capabilities:
  archetype: 'Compare'
  fixed_layers:
    - 'Comparison Frame'
    - 'Difference Layer'
    - 'Priority Layer'
    - 'Research Layer'
  generates: 'cross-company comparison with product exposure, financial and market differences, ranking, and next-step routing'
  output_format: 'markdown-first peer comparison with optional visual companion'
  time_estimate: '60-90 minutes'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'must not devolve into several pasted quickreads'
    - 'must include Product Exposure Matrix'
    - 'must include financial and market comparison'
    - 'must include ranking and preferred setup'
    - 'markdown is the primary artifact and research-viz is companion-only'
    - 'upgrade to research-viz when comparison visuals need side-by-side scanning'
    - 'parallel_evidence_spawn_default for source collection'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for rankings and conclusions'
    - 'url_claim_spot_check_required before using sub-agent sources'
  company_limit:
    min: 3
    max: 8
    overflow_action: 'first narrow the list or split by sub-industry / business model'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'peer-deep-dive.md'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-peer-deep-dive.md'
  naming_mode: 'optional_qualifier'
  save_trigger: 'save only when user asks to preserve the peer work as dated topic research result'
workflow:
  stage: 'deep-dive'
  prerequisites:
    - '3-8 selected companies'
  next_steps:
    - 'stock-quickread'
    - 'alpha-thesis'
    - 'research-viz'
  feeds_into:
    - 'stock-quickread'
    - 'alpha-thesis'
    - 'research-journal'
    - 'next-step'
  decision_point: 'which names deserve priority and where the biggest mismatch sits'
required_layers:
  - 'Comparison Frame'
  - 'Difference Layer'
  - 'Priority Layer'
  - 'Research Layer'
quality_gates:
  anti_patterns:
    - 'N_quickreads_pasted_together'
    - 'industry_intro_textbook'
    - 'no_cross_cut_signal'
    - 'vague_ranking'
    - 'visual_companion_without_base_markdown'
  data_requirements:
    - 'product_exposure_matrix'
    - 'financial_market_comparison'
    - 'research_priority'
    - 'next_questions'
