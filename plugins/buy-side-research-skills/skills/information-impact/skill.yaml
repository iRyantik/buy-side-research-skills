  - 'claim-check'
  - 'rumor-verification'
  - 'research-relevance'
trigger:
  type: 'keyword'
  keywords:
    - '这个消息靠谱吗'
    - '这条新闻怎么看'
    - '这个传闻靠谱吗'
    - '有没有 source'
    - '这个 claim 能不能信'
    - '供应链传闻'
    - '某客户供应链'
    - 'customer supply chain claim'
    - 'direct supplier'
    - 'tier-2'
    - 'product can be used'
    - 'theme association'
    - '是不是进了'
    - 'claim check'
    - 'research relevance'
    - '这条新闻影响什么'
    - '卖方报告'
    - '刚出的行业数据'
    - '刚出的宏观数据'
    - '今天早报过一遍'
  description: '当用户要验证一条信息或传闻是否可信、是否值得继续研究时触发'
capabilities:
  modes:
    - 'Claim Check'
    - 'Research Relevance'
    - 'Batch Filter'
  can_trigger:
    - 'next-step'
  feeds_into:
    - 'research-journal'
  requirements:
    - 'distinguish direct supplier, indirect supplier, product applicability, and theme association'
    - 'do not treat rumors as verified facts'
    - 'follow CLAUDE.md source policy'
