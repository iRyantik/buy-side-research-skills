  - 'ic-memo'
  - 'conviction'
  - 'buy-side'
  - 'investment-decision'
trigger:
  type: 'keyword'
  keywords:
    - '帮我搭一下 thesis'
    - '单股 thesis'
    - '多头 thesis'
    - '空头 thesis'
    - 'long thesis'
    - 'short thesis'
    - '帮我把 thesis 整理一下'
    - '我有个想法'
    - '帮我成型'
    - '为什么我看多'
    - '为什么我看空'
    - '帮我搭一个 pitch'
  description: '当用户要建立或整理单股 long-only / short-only 投资观点时触发；pair、hedge candidate 或 Long X Short Y 使用 pair-trade'
capabilities:
  generates: '8-section single-name investment thesis with variant view'
  output_format: '800-1500 字 完整逻辑'
  includes:
    - 'catalyst'
    - 'kill-criteria'
    - 'bull-base-bear'
    - 'sizing'
  requirements:
    - 'source links required'
    - 'quantitative support'
    - 'follow CLAUDE.md source policy'
    - 'market-snapshot fields default to topic-local evidence cache / financial-data then trusted-market-bridge then web fallback'
    - 'may use trusted-market-bridge for market_quote valuation_snapshot price_action and consensus'
    - 'trusted-market-bridge in this skill is limited to variant-view priced-in valuation-anchor and price-action context rather than company-truth fields'
    - 'scope_restricted unsupported_market ambiguous and unavailable may fall back to existing web or internet source logic unless longbridge_only is explicitly requested'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for thesis and position sizing'
    - 'sub-agent_opt_in_only unless the user explicitly requests sub-agent / delegate / parallel evidence collection'
    - 'use pair-trade for Long X Short Y, hedge candidates, and hedged structures'
  journal_first_handoff: 'research-journal or next-step'
artifact_policy:
  save_policy: 'default_topic_result'
  default_artifact: 'alpha-thesis.md'
  canonical_location: 'industry/<industry>/companies/<ticker>/YYYY-MM-DD-<artifact>.md'
  naming_mode: 'plain'
  save_trigger: 'always save to industry topic'
workflow:
  stage: 'analysis'
  prerequisites:
    - 'stock-quickread'
    - 'consensus-map when variant-view gap is not yet explicit'
  next_steps:
    - 'primary-research-plan'
    - 'bear-pre-mortem'
    - 'earnings-setup'
    - 'research-journal'
    - 'next-step'
  decision_point: 'conviction 是否真实'
required_sections:
  - 'variant_view_vs_consensus'
  - 'why_gap_exists'
  - 'specific_catalysts_with_timing'
  - 'bull_base_bear_scenarios_with_returns'
  - 'kill_criteria_with_observable_signals'
  - 'sizing_logic'
  - 'key_assumptions_list'
quality_gates:
  anti_patterns:
    - 'no_variant_view'
    - 'qualitative_without_numbers'
    - 'catalysts_are_long_term'
    - 'weak_bear_case'
    - 'empty_kill_criteria'
