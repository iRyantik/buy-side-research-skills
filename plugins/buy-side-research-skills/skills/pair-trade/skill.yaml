metadata_schema_version: 1
name: 'pair-trade'
id: 'pair-trade'
display_name: 'Pair Trade'
version: '1.0.1'
system_generation: '3.9.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'deep-work'
summary: 'Journal-first long/short pair research and monitor for pair validity, spread logic, and hedge candidates.'
description: 'Journal-first long/short pair research and monitor for pair validity, spread logic, and hedge candidates.'
tags:
  - 'pair-trade'
  - 'long-short'
  - 'spread'
  - 'market-neutral'
  - 'hedge-candidate'
trigger:
  type: 'keyword'
  keywords:
    - 'pair trade'
    - 'Long X Short Y'
    - 'Long / Short'
    - '做多 做空'
    - '这两个能不能 pair'
    - 'X 用什么对冲'
    - '某公司找 hedge candidate'
    - 'hedge candidate'
    - 'spread'
    - 'pair 还成立吗'
    - 'review all pairs'
    - 'review 一下所有 pair'
    - '找对冲'
  description: '当用户要构建、评估、监控 long/short pair 或寻找 hedge candidate 时触发'
capabilities:
  modes:
    - 'Builder'
    - 'Monitor'
  can_trigger:
    - 'next-step'
    - 'bear-pre-mortem'
    - 'earnings-setup'
  feeds_into:
    - 'research-journal'
  requirements:
    - 'two independent legs'
    - 'spread mechanism'
    - 'correlation and beta awareness'
    - 'borrow and liquidity awareness'
    - 'source links and as-of timestamps'
    - 'parallel_evidence_spawn_default for source collection'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for pair verdict and sizing'
    - 'url_claim_spot_check_required before using sub-agent sources'
artifact_policy:
  save_policy: 'default_topic_result'
  default_artifact: 'pair-note.md'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-pair-note.md'
  save_trigger: 'save builder or monitor output to the current dated result path by default; ask for path confirmation if no path is clear'
