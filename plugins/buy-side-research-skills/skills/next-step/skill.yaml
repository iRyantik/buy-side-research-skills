metadata_schema_version: 1
name: 'next-step'
id: 'next-step'
display_name: 'Next Step'
version: '1.2.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Choose the highest-value next research question when a thread feels stuck or incomplete.'
description: 'Choose the highest-value next research question when a thread feels stuck or incomplete.'
tags:
  - 'next-step'
  - 'research-coach'
  - 'senior-analyst'
  - 'research-audit'
  - 'edge-radar'
trigger:
  type: 'keyword'
  keywords:
    - '下一步怎么研究'
    - 'next step'
    - '这段哪里不对劲'
    - '这段研究哪里不对劲'
    - '帮我回溯一下'
    - '这个问题该怎么问'
    - '怎么继续挖'
    - '我卡住了'
    - '值得深挖'
  description: '当用户需要 senior analyst 式研究方向指导时触发'
capabilities:
  modes:
    - 'Research Direction Coach'
    - 'Research Audit'
    - 'Question Rewriter'
  writes: 'conversation-only'
  requirements:
    - 'give the highest-value research question'
    - 'ask only 1-2 AI questions by default'
    - 'route mechanism gaps to mechanism-map'
    - 'route driver and KPI gaps to driver-map'
    - 'route source or claim gaps to information-impact'
    - 'route field evidence or channel validation gaps to primary-research-plan'
    - 'route company foundation or disclosure evolution gaps to company-primer'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for next question and routing decision'
    - 'sub-agent_opt_in_only unless the user explicitly requests sub-agent / delegate / parallel evidence collection'
    - 'do not create standalone next-step files'
artifact_policy:
  save_policy: 'none'
  default_artifact: 'conversation-only'
  canonical_location: 'conversation-only'
  save_trigger: 'never create standalone next-step files; hand off earned insights to research-journal'
