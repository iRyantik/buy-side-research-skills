metadata_schema_version: 1
name: 'research-journal'
id: 'research-journal'
display_name: 'Research Journal'
version: '1.2.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'memory'
summary: 'Summarize completed research into durable topic notes and boss brief outputs.'
description: 'Summarize completed research into durable topic notes and boss brief outputs.'
tags:
  - 'research-journal'
  - 'topic-journal'
  - 'boss-brief'
  - 'research-notes'
  - 'buy-side'
trigger:
  type: 'keyword'
  keywords:
    - '总结本轮研究'
    - '总结本轮行业研究'
    - '总结本轮 topic 研究'
    - '写进 journal'
    - 'research journal'
    - '整理这个 topic'
    - '更新 topic index'
    - '把这次 session 加到 index'
    - '做一版给老板看的'
    - 'boss brief'
    - '给 PM 的版本'
    - '发给别人看的'
  description: '当用户要沉淀研究结果或生成老板版研究 memo 时触发'
capabilities:
  modes:
    - 'Private Research Journal'
    - 'Boss Brief'
    - 'Topic Index Update'
  writes:
    - 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-research-journal.md'
    - 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-boss-brief.md'
  updates:
    - 'topics/[topic-namespace]/[topic-slug]/index.md'
  requirements:
    - 'preserve solved research insight, not raw reminders'
    - 'apply Earned Insight Gate before writing'
    - 'do not record unresolved mechanism or driver guesses as settled facts'
    - 'route unresolved mechanism gaps to mechanism-map'
    - 'route unresolved driver and KPI gaps to driver-map'
    - 'route unresolved source or claim gaps to information-impact'
    - 'route unresolved company foundation or disclosure evolution gaps to company-primer'
    - 'maintain topic index as an evolutionary map, not a state tracker'
    - 'boss brief is high-density, not simplified'
    - 'follow Global Rules Capsule source policy'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for earned insight and Boss Brief'
    - 'sub-agent_opt_in_only unless the user explicitly requests sub-agent / delegate / parallel evidence collection'
artifact_policy:
  save_policy: 'earned_memory'
  default_artifact: 'research-journal.md | boss-brief.md | index.md'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-research-journal.md or [YYYY-MM-DD]-boss-brief.md; topic index at topics/[topic-namespace]/[topic-slug]/index.md'
  save_trigger: 'write only content that passes the Earned Insight Gate; do not store raw reminders or unresolved guesses'
