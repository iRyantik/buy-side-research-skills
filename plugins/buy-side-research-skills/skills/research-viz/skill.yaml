metadata_schema_version: 1
name: 'research-viz'
id: 'research-viz'
display_name: 'Research Viz'
version: '1.0.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'supporting'
summary: 'Create memo-ready and screenshot-ready HTML research visualizations paired with a saved topic artifact.'
description: 'Create memo-ready and screenshot-ready HTML research visualizations paired with a saved topic artifact.'
tags:
  - 'visualization'
  - 'chart'
  - 'html'
  - 'memo-ready'
  - 'supporting-skill'
  - 'research-viz'
trigger:
  type: 'keyword'
  keywords:
    - '把这篇研究文做成图'
    - '画个图'
    - '做成可视化'
    - '做 capability map'
    - '做 peer scatter'
    - '做 valuation band'
    - 'research-viz'
  description: '当用户想把已有研究文或 source-backed 数据做成 memo-ready HTML 图表时触发'
capabilities:
  generates: 'self-contained html research visualization'
  output_format: 'single html chart or small visual package aligned to a base research artifact'
  time_estimate: '20-60 minutes'
  includes:
    - 'static or interactive html chart variants'
    - 'source line and memo-ready framing'
  requirements:
    - 'must bind to a base markdown research artifact before saving topic-side html output'
    - 'must preserve source-backed numbers facts and labels'
    - 'must use assets/template.html or assets/template-interactive.html rather than ad hoc visual scaffolds'
    - 'must load references/design-tokens.md for every chart'
    - 'interactive variants should also load references/interaction-patterns.md'
    - 'does not replace the base research artifact or create unsupported thesis claims'
artifact_policy:
  save_policy: 'default_topic_result'
  default_artifact: 'base-research-stem.html'
  canonical_location: 'industry/<industry>/companies/<ticker>/[base-research-stem][-qualifier].html'
  save_trigger: 'save when the user wants a topic-side html visualization paired with a specific markdown research artifact'
workflow:
  stage: 'supporting-visualization'
  can_follow:
    - 'stock-quickread'
    - 'company-history'
    - 'mechanism-map'
    - 'driver-map'
    - 'consensus-map'
    - 'peer-deep-dive'
    - 'cross-market-compare'
    - 'alpha-thesis'
    - 'bear-pre-mortem'
    - 'research-journal'
  feeds_into:
    - 'research-journal'
  can_trigger: []
quality_gates:
  anti_patterns:
    - 'marketing_style_landing_page'
    - 'uncited_chart_claims'
    - 'saving_unbound_research_viz_html'
    - 'invented_numbers_for_chart_completion'
    - 'missing_title_subtitle_or_source_line'
  required_outputs:
    - 'self-contained html file'
    - 'base-artifact stem alignment'
    - 'source line'
