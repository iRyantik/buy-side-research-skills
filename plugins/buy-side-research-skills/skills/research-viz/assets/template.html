<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{{ TITLE }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<!-- Uncomment if needed:
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-sankey@0.12"></script>
-->
<style>
  :root {
    --paper:           #FAFAF7;
    --paper-edge:      #F4F3EE;
    --ink:             #1A1A1A;
    --ink-2:           #4A4A4A;
    --ink-3:           #6B6B6B;
    --hairline:        #D4D4CE;
    --grid:            #E8E7E1;

    --accent:          #1F3A5F;
    --accent-soft:     #4A6B8A;
    --accent-ghost:    #C8D2DE;

    --highlight:       #8B2635;
    --highlight-soft:  #C77E3A;

    --pos:             #2D5F3F;
    --pos-soft:        #A8C4B0;
    --neg:             #8B2635;
    --neg-soft:        #D4A5A5;
    --neutral:         #B5B5AE;

    --cat-1: #1F3A5F;
    --cat-2: #8B2635;
    --cat-3: #C77E3A;
    --cat-4: #6B7F5C;
    --cat-5: #4A5D6C;

    --font-serif: 'Source Serif 4', 'Source Serif Pro', 'Tinos', Georgia, serif;
    --font-sans:  'Inter', 'Helvetica Neue', Arial, sans-serif;
    --font-mono:  'JetBrains Mono', 'Source Code Pro', Menlo, monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.5;
    font-feature-settings: "tnum" 1, "lnum" 1;
  }

  /* Figure container — switch class to .figure-memo for 800×1100 */
  .figure-slide {
    width: 1200px;
    min-height: 675px;
    margin: 32px auto;
    padding: 48px 56px 40px 56px;
    background: var(--paper);
    border: 1px solid var(--hairline);
  }
  .figure-memo {
    width: 800px;
    min-height: 1100px;
    margin: 32px auto;
    padding: 48px 56px 40px 56px;
    background: var(--paper);
    border: 1px solid var(--hairline);
  }

  .chart-eyebrow {
    font-family: var(--font-sans);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-3);
    margin: 0 0 6px 0;
  }
  .chart-title {
    font-family: var(--font-serif);
    font-size: 24px;
    font-weight: 600;
    line-height: 1.2;
    color: var(--ink);
    margin: 0 0 6px 0;
  }
  .chart-subtitle {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 400;
    color: var(--ink-2);
    margin: 0 0 20px 0;
  }
  .chart-source {
    font-family: var(--font-sans);
    font-size: 10.5px;
    color: var(--ink-3);
    font-style: italic;
    margin-top: 16px;
    border-top: 1px solid var(--hairline);
    padding-top: 8px;
  }

  /* SVG defaults */
  svg { display: block; max-width: 100%; }
  .axis text {
    font-family: var(--font-sans);
    font-size: 11px;
    fill: var(--ink-2);
  }
  .axis-num text {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    fill: var(--ink-2);
  }
  .axis path, .axis line { stroke: var(--hairline); shape-rendering: crispEdges; }
  .grid line {
    stroke: var(--grid);
    stroke-width: 1;
    stroke-dasharray: 1 3;
    shape-rendering: crispEdges;
  }
  .grid path { stroke: none; }
  .axis-label {
    font-family: var(--font-sans);
    font-size: 11px;
    fill: var(--ink-3);
  }
  .data-label {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    fill: var(--ink);
  }
  .callout {
    font-family: var(--font-serif);
    font-style: italic;
    font-size: 12px;
    fill: var(--ink-2);
  }
  .focal { fill: var(--highlight); }

  /* Tables (used by sotp, debt ladder, etc) */
  table.tabular {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  table.tabular th, table.tabular td {
    padding: 6px 10px;
    border-bottom: 1px solid var(--hairline);
  }
  table.tabular th {
    font-weight: 600;
    text-align: left;
    color: var(--ink-2);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 1px solid var(--ink-2);
  }
  table.tabular td.num {
    text-align: right;
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
  }
  table.tabular tr.total td {
    border-top: 1px solid var(--ink);
    border-bottom: 2px solid var(--ink);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="figure-slide">  <!-- or class="figure-memo" -->

  <p class="chart-eyebrow">{{ EYEBROW — e.g. "TSMC · 2330 TT · Operations" }}</p>
  <h1 class="chart-title">{{ TITLE }}</h1>
  <p class="chart-subtitle">{{ SUBTITLE — units, period, ticker }}</p>

  <div id="chart"></div>

  <p class="chart-source">Source: {{ SOURCE }}. As of {{ DATE }}.</p>
</div>

<script>
  // ────────────────────────────────────────────────────────────
  // CHART CODE — replace this block with the specific chart's
  // template from references/<chart>.md
  // ────────────────────────────────────────────────────────────

  const data = []; // ← analyst's data goes here

  const margin = { top: 24, right: 24, bottom: 40, left: 56 };
  const width  = 1200 - 56 - 56;   // figure inner width minus padding
  const height = 480;
  const innerW = width - margin.left - margin.right;
  const innerH = height - margin.top - margin.bottom;

  const svg = d3.select("#chart")
    .append("svg")
      .attr("viewBox", `0 0 ${width} ${height}`)
      .attr("width", width)
      .attr("height", height);

  const g = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  // chart-specific drawing goes here
</script>

</body>
</html>
