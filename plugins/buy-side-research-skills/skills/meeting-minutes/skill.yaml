metadata_schema_version: 1
name: 'meeting-minutes'
id: 'meeting-minutes'
display_name: 'Meeting Minutes'
version: '1.0.0'
system_generation: '5.6.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Turn raw voice-transcribed meeting notes into structured research minutes with corrected names, background context, and RAG-verified claims.'
description: 'Turn raw voice-transcribed meeting notes into structured research minutes with corrected names, background context, and RAG-verified claims.'
tags:
  - 'meeting-minutes'
  - 'call-summary'
  - 'transcript'
  - 'claim-verification'
  - 'rag'
trigger:
  type: 'keyword'
  keywords:
    - '整理会议纪要'
    - '会议纪要'
    - '帮我整理这个会议'
    - '录音转文字'
    - '电话会议'
    - '产业调研'
    - '专家访谈'
    - 'call summary'
    - 'transcript'
    - '帮我纠错'
    - '结构化'
    - 'meeting minutes'
  description: '当用户粘贴语音转文字稿需要纠错、结构化、验证claim时触发。'
capabilities:
  modes:
    - 'Full Minutes (transcript → structured notes + RAG verification)'
  output_path: 'industry/<industry>/YYYY-MM-DD-call-summary-<qualifier>.md'
  requirements:
    - 'correct transcription errors (company names, terms, products)'
    - 'produce name correction table (raw → correct + ticker)'
    - 'extract and classify all verifiable claims'
    - 'key claims (market share/customer/order/price) require Tier 2 Playwright verification'
    - 'general claims require Tier 1 WebFetch/WebSearch minimum'
    - 'supplement company/industry background from workspace cache or web search'
    - 'flag unverifiable claims as [需查证]'
    - 'clearly distinguish speaker opinion from verified fact'
    - 'must not fabricate source URLs'
    - 'must preserve original transcript text for corrections'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'call-summary.md'
  canonical_location: 'industry/<industry>/YYYY-MM-DD-call-summary-<qualifier>.md'
  naming_mode: 'required_qualifier'
  save_trigger: 'save when user asks to preserve the minutes as dated topic research artifact'
workflow:
  stage: 'triage-filter'
  can_follow:
    - 'ingest'
  feeds_into:
    - 'information-impact'
    - 'stock-quickread'
    - 'industry-landscape'
    - 'mechanism-insight'
    - 'research-journal'
  can_trigger:
    - 'next-step'
  decision_point: '不是研究产出，是信息过滤和初步溯源——建立对一场会议的基础认知后，深挖单条 claim 用 information-impact，深挖公司用 stock-quickread'
quality_gates:
  anti_patterns:
    - 'correcting_terms_without_original_text'
    - 'guessing_company_names'
    - 'key_claims_only_tier_1'
    - 'using_websearch_summary_as_source'
    - 'fabricating_source_urls'
    - 'treating_speaker_opinion_as_fact'
    - 'no_name_correction_table'
    - 'missing_claim_verification_section'
    - 'publishing_sensitive_content'
  data_requirements:
    - 'name_correction_table_with_ticker'
    - 'claim_classification_key_vs_general_vs_opinion'
    - 'rag_verification_with_tier_label'
    - 'company_background_supplement'
    - 'technical_background_supplement'
    - 'source_list_in_resources'
