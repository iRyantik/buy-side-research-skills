metadata_schema_version: 1
name: 'meeting-minutes'
id: 'meeting-minutes'
display_name: 'Meeting Minutes'
version: '2.0.0'
system_generation: '5.6.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Turn audio or transcripts into briefing (external email) and qa (external Q&A) with layered appendix for flexible sharing. Bilingual output (ZH/EN). Full pipeline: mp3 → verbatim → scratchpad → briefing/qa.'
description: 'Full meeting-minutes pipeline from audio or transcript to structured research output. Two templates (briefing + qa) with appendix layers. Bilingual output (ZH/EN). Includes audio transcription via whisper-large-v3-turbo with bitrate check, chunking, and merge. Scratchpad saved as cache middleware. Appendix layers from company profile (external-safe) down to follow-up/resources (internal-only).'
tags:
  - 'meeting-minutes'
  - 'call-summary'
  - 'transcript'
  - 'claim-verification'
  - 'rag'
  - 'briefing'
  - 'qa'
  - 'bilingual'
trigger:
  type: 'keyword'
  keywords:
    - '整理会议纪要'
    - '会议纪要'
    - '帮我整理这个会议'
    - '录音转文字'
    - '电话会议'
    - '产业调研'
    - '专家访谈'
    - 'call summary'
    - 'transcript'
    - '帮我纠错'
    - '结构化'
    - 'meeting minutes'
    - '记录会议'
    - '转录'
  description: '当用户粘贴语音转文字稿或提供音频文件，需要整理为结构化briefing或qa时触发。'
capabilities:
  modes:
    - 'briefing (external email, topic → prose)'
    - 'qa (external Q&A, condensed)'
    - 'bilingual output (ZH/EN)'
    - 'full pipeline: audio → verbatim → scratchpad → briefing/qa'
  requirements:
    - 'transcribe audio via whisper-large-v3-turbo with bitrate check and chunking'
    - 'correct transcription errors (company names, terms, products)'
    - 'extract entities and save scratchpad to cache'
    - 'inject background from workspace cache or web search'
    - 'output bilingual briefing and qa with layered appendix'
    - 'key claims require Tier 2 Playwright verification'
    - 'general claims require Tier 1 WebFetch/WebSearch minimum'
    - 'appendix layers: Company Profile → Industry → Claims → Corrections → Follow-up → Resources'
    - 'no verification tags in body text'
    - 'no narrative scaffolding (管理層开场/坦言/强调 etc.)'
    - 'no stand-alone 关键点 callout sections'
    - 'no English source quotes in Chinese output'
    - 'must read full transcript to end before output'
artifact_policy:
  save_policy: 'both_cache_and_artifact'
  cache_location: '.cache/meeting-minutes/{raw,transcripts,<scratchpad>.json}'
  artifact_location: 'companies/<ticker>/YYYY-MM-DD-<call>_{briefing,qa}_{zh,en}.md'
  canonical_industry_location: 'industry/<slug>/panorama/meeting-minutes/YYYY-MM-DD-<topic>_{briefing,qa}_{zh,en}.md'
  naming_mode: 'required_qualifier'
  save_trigger: 'save always — scratchpad to cache, artifacts to company/industry dir'
workflow:
  stage: 'triage-filter'
  can_follow:
    - 'init-workspace'
  feeds_into:
    - 'information-impact'
    - 'stock-quickread'
    - 'industry-landscape'
    - 'mechanism-insight'
    - 'research-journal'
  can_trigger:
    - 'next-step'
  decision_point: '不是最终研究产出。建立对一场会议的基础认知后，深挖单条 claim 用 information-impact，深挖公司用 stock-quickread。产出 bilingual briefing/qa，appendix 分层按需剪裁。'
quality_gates:
  anti_patterns:
    - 'output_without_reading_full_transcript'
    - 'correcting_terms_without_original_text'
    - 'guessing_company_names'
    - 'key_claims_only_tier_1'
    - 'using_websearch_summary_as_source'
    - 'fabricating_source_urls'
    - 'narrative_scaffolding_sentences'
    - 'standalone_关键点_callout'
    - 'english_quotes_in_chinese_output'
    - 'cross_company_editorializing'
    - 'verification_tags_in_body_text'
    - 'fabricating_company_background'
    - 'publishing_sensitive_content'
  data_requirements:
    - 'scratchpad_json_in_cache'
    - 'bilingual_briefing_with_appendix'
    - 'bilingual_qa_with_appendix'
    - 'name_correction_table_in_appendix'
    - 'claim_classification_key_vs_general_vs_opinion'
    - 'rag_verification_with_tier_label'
    - 'background_injected_from_cache_or_web'
    - 'source_list_in_resources'
