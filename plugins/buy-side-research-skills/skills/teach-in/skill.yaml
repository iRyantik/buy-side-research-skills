metadata_schema_version: 1
name: 'teach-in'
id: 'teach-in'
display_name: 'Industry Teach-In'
version: '2.0.0'
system_generation: '5.6.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'foundation'
summary: 'Build zero-to-one physical intuition for an unfamiliar industry with no investment judgment.'
description: 'Build zero-to-one physical intuition for an unfamiliar industry — why it exists, what is inside, how it is made, and who does what. Pure engineering literacy, zero investment judgment. Hands off to industry-landscape or mechanism-insight for research conclusions.'
tags:
  - 'teach-in'
  - 'primer'
  - 'industry-literacy'
  - 'engineering-intuition'
  - 'physical-constraint'
  - 'manufacturing-chain'
  - 'zero-to-one'
trigger:
  type: 'keyword'
  keywords:
    - 'teach-in'
    - 'teach in'
    - 'primer'
    - '零基础'
    - '从零开始'
    - '完全不懂'
    - '给我科普'
    - '给我讲这个行业'
    - '先补课'
    - '是什么东西'
    - '干嘛用的'
    - '这行业到底是什么'
    - '从零讲'
    - '入门科普'
  description: '当用户对一个行业/技术完全零基础，需要建立物理直觉和工程常识时触发。不是研究产出，是研究前置条件。'
capabilities:
  modes:
    - 'Full Teach-In (7+1 layer)'
    - 'Quick Teach-In (abbreviated, skip Layer 3.5 for non-engineering industries)'
  output_path: 'industry/[industry-slug]/[YYYY-MM-DD]-teach-in-[qualifier].md when user asks to save'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'organic research contents are separate from this skill file; use skill for method guidance only'
    - 'must include ASCII architecture diagrams for every layer'
    - 'must include product/equipment photos for Layers 2-6'
    - 'must include scale comparison with everyday analogies'
    - 'must include material science layer for semiconductor/manufacturing industries'
    - 'must include routing handoff at end of Layer 6'
    - 'must not make any investment judgment'
    - 'must not do company valuation or thesis'
    - 'sub-agent_opt_in_only for parallel image downloads; main agent for all prose and ASCII diagrams'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'teach-in.md'
  canonical_location: 'industry/[industry-slug]/[YYYY-MM-DD]-teach-in-[qualifier].md'
  naming_mode: 'required_qualifier'
  save_trigger: 'save only when user asks to preserve the teach-in as dated topic research artifact'
workflow:
  stage: 'research-primitive'
  can_follow:
    - 'ingest'
    - ''
  feeds_into:
    - 'industry-landscape'
    - 'mechanism-insight'
    - 'candidate-screener'
    - 'stock-quickread'
    - 'driver-map'
    - 'consensus-map'
  can_trigger:
    - ''
  decision_point: '不是研究产出，而是研究前置条件——建立物理直觉后，应该用 industry-landscape 判断行业投资价值，或用 mechanism-insight 深挖单段机制'
quality_gates:
  anti_patterns:
    - 'investment_judgment_in_teach_in'
    - 'no_ascii_diagrams'
    - 'no_product_photos'
    - 'no_scale_comparison'
    - 'missing_material_science_for_semiconductor'
    - 'missing_layer_zero_category_rationale'
    - 'missing_routing_handoff'
    - 'missing_three_sentence_summary'
    - 'missing_common_misconceptions_table'
    - 'missing_next_layer_questions'
    - 'doing_industry_landscape_or_mechanism_insight_work'
    - 'encyclopedia_not_cognitive_framework'
    - 'layer_six_companies_only_no_barrier_scoring'
    - 'layer_four_no_yield_bottleneck_analysis'
    - 'layer_five_no_super_cycle_framework'
    - 'equipment_industry_no_value_pool_split'
  data_requirements:
    - 'physics_constraints_with_source'
    - 'spatial_topology_ascii_diagram'
    - 'internal_structure_explosion_ascii'
    - 'material_selection_rationale'
    - 'material_function_matrix_table'
    - 'full_manufacturing_chain_with_equipment_and_accuracy'
    - 'yield_bottleneck_analysis_per_step'
    - 'generational_upgrade_table'
    - 'company_roster_with_segment_mapping'
    - 'competitive_barrier_scoring_table'
    - 'equipment_value_pool_split'
    - 'three_sentence_summary'
    - 'common_misconceptions_table'
    - 'next_layer_questions'
    - 'routing_handoff'
