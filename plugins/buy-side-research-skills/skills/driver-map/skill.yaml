metadata_schema_version: 1
name: 'driver-map'
id: 'driver-map'
display_name: 'Driver Map'
version: '1.1.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'foundation'
summary: 'Decompose revenue margin backlog price volume mix and segment drivers before modeling.'
description: 'Decompose revenue margin backlog price volume mix and segment drivers before modeling.'
tags:
  - 'driver-map'
  - 'mechanism-map'
  - 'revenue-driver'
  - 'margin-driver'
  - 'segment-drivers'
  - 'revenue-split'
  - 'backlog-conversion'
  - 'price-volume-mix'
  - 'model-driver-gap'
  - 'senior-analyst-radar'
trigger:
  type: 'keyword'
  keywords:
    - '拆 driver'
    - '收入怎么拆'
    - 'revenue driver'
    - 'segment driver'
    - 'bucket 为什么怪'
    - '这家公司靠什么增长'
    - 'backlog 怎么进收入'
    - 'price volume mix'
    - 'margin driver'
    - 'weird bucket'
    - 'reported bucket'
    - 'segment bucket'
    - '披露口径异常'
    - '业务实质'
    - 'model-driver gap'
  description: '当用户要拆公司或业务的收入、利润率、backlog、price/volume/mix driver，或解释怪异披露口径时触发'
capabilities:
  modes:
    - 'Driver Map'
  output_path: 'topics/company/[company-slug]/_cache/driver-map/driver-map.md plus internal/driver-map.json when user asks to save model-readable driver inputs'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'map reported buckets to business reality'
    - 'map business reality to model drivers'
    - 'flag model-driver gaps and weird disclosure'
    - 'write public driver-map.md and internal/driver-map.json with segment/geography treatment, revenue drivers, margin drivers, valuation methods, model type recommendation, and confidence/source status when saving for modeling'
    - 'read financial-data internal/actuals-resolved.json first; use statements.revenue_split when present'
    - 'fallback to internal/full-filing.md for LLM extraction only when structured revenue_split is missing'
    - 'label revenue split source as provider-structured, provider-table-review, llm-extracted-review, or not-disclosed'
    - 'when financial-data revenue_split rows have review_required true, map axis/member labels to model buckets before modeling'
    - 'hand off company foundation or disclosure evolution history to company-primer'
    - 'hand off field evidence gaps to primary-research-plan'
    - 'do not perform DCF or comps'
    - 'do not create or edit workbooks'
    - 'parallel_evidence_spawn_default for source collection'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for final driver tree and model treatment'
    - 'url_claim_spot_check_required before using sub-agent sources'
artifact_policy:
  save_policy: 'cache_artifact'
  default_artifact: 'driver-map.md'
  canonical_location: 'topics/company/[company-slug]/_cache/driver-map/driver-map.md and internal/driver-map.json'
  save_trigger: 'save only when user asks to preserve driver mapping as model-readable company cache'
workflow:
  stage: 'research-primitive'
  can_follow:
    - 'mechanism-map'
    - 'company-primer'
    - 'stock-quickread'
    - 'information-impact'
  feeds_into:
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
    - 'model-update'
    - 'alpha-thesis'
    - 'primary-research-plan'
    - 'peer-deep-dive'
    - 'pair-trade'
    - 'research-journal'
  can_trigger:
    - 'next-step'
