author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'foundation'
summary: 'Decompose revenue margin backlog price volume mix and segment drivers before modeling.'
description: 'Decompose revenue margin backlog price volume mix and segment drivers before modeling.'
tags:
  - 'driver-map'
  - 'revenue-driver'
  - 'margin-driver'
  - 'backlog-conversion'
  - 'price-volume-mix'
  - 'primer'
trigger:
  type: 'keyword'
  keywords:
    - 'driver-map'
    - 'revenue driver'
    - 'segment driver'
    - 'backlog 怎么进收入'
    - 'price volume mix'
  description: '当用户要拆收入、利润率、backlog 或 price-volume-mix 驱动时触发'
capabilities:
  archetype: 'Primer'
  fixed_layers:
    - 'Foundation Layer'
    - 'Interpretation Layer'
    - 'Research Layer'
    - 'Decision Layer'
  modes:
    - 'Driver Map'
  output_path: 'topics/company/[company-slug]/_cache/driver-map/driver-map.md plus internal/driver-map.json when user asks to save model-readable driver inputs'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'map reported buckets to business reality'
    - 'map business reality to model drivers'
    - 'flag model-driver gaps and weird disclosure'
    - 'read financial-data internal/actuals-resolved.json first when available'
    - 'hand off company foundation or disclosure evolution history to company-primer'
    - 'hand off field evidence gaps to primary-research-plan'
    - 'do not perform DCF or comps'
    - 'do not create or edit workbooks'
    - 'parallel_evidence_spawn_default for source collection'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for final driver tree and model treatment'
artifact_policy:
  save_policy: 'cache_artifact'
  default_artifact: 'driver-map.md'
  canonical_location: 'topics/company/[company-slug]/_cache/driver-map/driver-map.md and internal/driver-map.json'
  save_trigger: 'save only when user asks to preserve driver mapping as model-readable company cache'
workflow:
  stage: 'research-primitive'
  can_follow:
    - 'mechanism-map'
    - 'company-primer'
    - 'stock-quickread'
    - 'information-impact'
  feeds_into:
    - 'alpha-thesis'
    - 'peer-deep-dive'
    - 'research-journal'
  can_trigger:
    - 'next-step'
required_layers:
  - 'Foundation Layer'
  - 'Interpretation Layer'
  - 'Research Layer'
  - 'Decision Layer'
