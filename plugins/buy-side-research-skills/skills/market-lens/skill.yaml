required_layers:
  - 'Market State Layer'
  - 'Expectation Layer'
  - 'Proof Layer'
  - 'Decision Layer'
quality_gates:
  anti_patterns:
    - 'style_only_without_proof'
    - 'single_name_thesis_written_inside_market_lens'
    - 'missing_fomo_expansion_test'
  data_requirements:
