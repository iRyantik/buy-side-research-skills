  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-market-lens[-qualifier].md'
  naming_mode: 'optional_qualifier'
  save_trigger: 'save only when user asks to preserve the market overlay as dated topic research result'
workflow:
  stage: 'market-foundation'
  can_follow:
    - 'new-session'
    - 'industry-quickread'
    - 'stock-quickread'
    - 'next-step'
