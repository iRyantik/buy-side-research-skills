  output_format: 'markdown-first market note with optional visual companion'
  time_estimate: '20-45 minutes'
  includes:
    - 'Global Risk Appetite'
    - 'Local Market Style'
    - 'Theme Crowding'
    - '1-3M Tape / Style'
    - '6-12M Fundamental Setup'
    - 'FOMO Expansion Test'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'treat this skill as market overlay, not single-name thesis replacement'
