metadata_schema_version: 1
name: 'question-sharpener'
id: 'question-sharpener'
display_name: 'Question Sharpener'
version: '1.0.0'
system_generation: '5.0.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Decompose fuzzy research questions into precise answerable sub-questions and route to downstream skills.'
description: 'Decompose fuzzy research questions into precise answerable sub-questions and route to downstream skills.'
tags:
  - 'question-sharpener'
  - 'question-decomposition'
  - 'routing'
  - 'research-planning'
trigger:
  type: 'keyword'
  keywords:
    - '这问题该怎么问'
    - '帮我理清思路'
    - '我不会问'
    - '这些都是啥'
    - '给我讲清楚'
    - '我不知道怎么问'
    - '问题太模糊'
    - 'question sharpener'
  description: '当用户的提问模糊、混合多个维度，或用户表示"不知道怎么问"时触发'
capabilities:
  generates: 'question decomposition table + routing plan'
  output_format: 'dimension split table + known/unknown status + route + suggested sequence'
  time_estimate: '5 minutes'
  requirements:
    - 'decompose before research — never answer fuzzy questions directly'
    - 'check existing workspace artifacts before launching new research'
    - 'always route physical-intuition questions to teach-in first'
    - 'do not output analysis — this skill does navigation, not research'
    - 'follow CLAUDE.md source policy'
artifact_policy:
  save_policy: 'none'
  default_artifact: 'conversation-only'
  canonical_location: 'conversation-only'
  save_trigger: 'none'
