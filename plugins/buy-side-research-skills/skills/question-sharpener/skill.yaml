metadata_schema_version: 1
name: 'question-sharpener'
id: 'question-sharpener'
display_name: 'Question Sharpener'
version: '1.0.0'
system_generation: '5.0.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Sharpen vague research questions into precise answerable questions by clarifying intent and surfacing hidden assumptions.'
description: 'Sharpen vague research questions into precise answerable questions by clarifying intent and surfacing hidden assumptions.'
tags:
  - 'question-sharpener'
  - 'question-framing'
  - 'research-planning'
trigger:
  type: 'keyword'
  keywords:
    - '这问题该怎么问'
    - '帮我理清思路'
    - '我不会问'
    - '这些都是啥'
    - '给我讲清楚'
    - '我不知道怎么问'
    - '问题太模糊'
    - '我不确定我在问什么'
    - '帮我想想这个问题'
    - '怎么把这个问题问得更好'
    - '帮我重新表述'
    - 'question sharpener'
    - 'reframe this question'
    - 'sharpen this question'
  description: '当用户提问模糊、混合多个维度，或表示"不知道怎么问"时触发'
capabilities:
  generates: 'sharpened questions with intent analysis and blind spot surfacing'
  output_format: 'intent analysis + blind spots + 1-3 reframed questions + brief path suggestion'
  time_estimate: '3 minutes'
  requirements:
    - 'do not route — sharpen'
    - 'understand intent before decomposing'
    - 'surface hidden assumptions and blind spots'
    - 'reframe, do not just split'
    - 'routing is a one-liner footnote, not the main output'
    - 'follow CLAUDE.md source policy'
artifact_policy:
  save_policy: 'none'
  default_artifact: 'conversation-only'
  canonical_location: 'conversation-only'
  save_trigger: 'none'
