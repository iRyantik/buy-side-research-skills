metadata_schema_version: 1
name: 'consensus-map'
id: 'consensus-map'
display_name: 'Consensus Map'
version: '1.0.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'foundation'
summary: 'Map consensus buy-side bar priced-in assumptions revisions and variant-view gaps.'
description: 'Map consensus buy-side bar priced-in assumptions revisions and variant-view gaps.'
tags:
  - 'consensus-map'
  - 'consensus-mapping'
  - 'priced-in'
  - 'buy-side-bar'
  - 'market-expectations'
  - 'variant-view'
  - 'expectations-map'
  - 'research-foundation'
  - 'buy-side'
trigger:
  type: 'keyword'
  keywords:
    - 'consensus map'
    - 'consensus-map'
    - 'consensus mapping'
    - 'expectations map'
    - 'market expectations'
    - 'priced in'
    - 'priced-in'
    - 'buy-side bar'
    - 'buyside bar'
    - 'sell-side consensus'
    - '市场预期'
    - '市场到底price了什么'
    - '市场到底 priced in 什么'
    - '共识在哪里'
    - 'consensus 在哪里'
    - 'variant view gap'
    - '多空争论在哪里'
  description: '当用户要系统拆解单股、peer set、行业或主题的 sell-side consensus、buy-side bar、priced-in assumptions、market-implied expectations 或 variant-view gap 时触发'
capabilities:
  modes:
    - 'Single-Name Consensus Map'
    - 'Industry / Theme Consensus Map'
    - 'Tight Expectations Check'
  output_path: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-consensus-map.md when user asks to save'
  feeds_into:
    - 'alpha-thesis'
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
    - 'model-update'
    - 'earnings-setup'
    - 'driver-map'
    - 'mechanism-map'
    - 'primary-research-plan'
    - 'research-journal'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'separate sell-side consensus from inferred buy-side bar'
    - 'label market-implied assumptions as inference unless fully modeled'
    - 'mark missing consensus data as [需查证] instead of fabricating'
    - 'do not write full alpha thesis or earnings setup'
    - 'parallel_evidence_spawn_default for source collection'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for consensus conclusion and variant-view gap'
    - 'url_claim_spot_check_required before using sub-agent sources'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'consensus-map.md'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-consensus-map.md'
  save_trigger: 'save only when user asks to preserve the consensus map as dated topic research result'
workflow:
  stage: 'expectations-foundation'
  can_follow:
    - 'new-session'
    - 'ingest'
    - 'stock-quickread'
    - 'industry-quickread'
    - 'peer-deep-dive'
    - 'next-step'
  feeds_into:
    - 'alpha-thesis'
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
    - 'model-update'
    - 'earnings-setup'
    - 'driver-map'
    - 'mechanism-map'
    - 'primary-research-plan'
    - 'research-journal'
  decision_point: '市场、卖方和买方当前到底相信什么，以及是否存在足够清晰的 variant-view gap 进入 thesis、model、earnings setup 或 primary research'
quality_gates:
  anti_patterns:
    - 'broker_rating_dump'
    - 'sell_side_eps_only'
    - 'unsourced_consensus_number'
    - 'unlabeled_buy_side_bar_inference'
    - 'priced_in_claim_without_evidence'
    - 'thesis_written_too_early'
    - 'print_specific_bar_not_routed_to_earnings_setup'
  data_requirements:
    - 'provider_and_as_of_for_consensus_numbers'
    - 'revision_direction'
    - 'buy_side_bar_evidence'
    - 'market_implied_assumption_method'
    - 'debate_map'
    - 'routing_recommendation'
