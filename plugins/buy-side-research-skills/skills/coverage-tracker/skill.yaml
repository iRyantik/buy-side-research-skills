metadata_schema_version: 1
name: 'coverage-tracker'
id: 'coverage-tracker'
display_name: 'Coverage Tracker'
version: '1.2.0'
system_generation: '5.37.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'memory'
summary: 'Maintain objective workspace coverage state with research tiers, alert tiers, review dates, and next triggers.'
description: 'Maintain objective workspace coverage state with research tiers, alert tiers, review dates, and next triggers.'
tags:
  - 'coverage-tracker'
  - 'coverage'
  - 'watchlist'
  - 'research-priority'
  - 'alert-tier'
trigger:
  type: 'keyword'
  keywords:
    - 'coverage'
    - 'update coverage'
    - 'coverage tracker'
    - '覆盖跟踪'
    - '重排优先级'
    - 'coverage status'
  description: 'Trigger when the user wants to update or review objective workspace coverage state.'
capabilities:
  generates: 'workspace COVERAGE.md with research tiers, alert tiers, stage, review date, and next trigger'
  feeds_into:
    - 'coverage-monitor'
    - 'research-journal'
  requirements:
    - 'each entry must have research_tier, alert_tier, stage, last_review, and next_trigger'
    - 'research tier must stay objective and not depend on subjective conviction'
    - 'alert tier separates daily monitoring from intraday alerting'
artifact_policy:
  save_policy: 'earned_memory'
  default_artifact: 'COVERAGE.md'
  canonical_location: 'COVERAGE.md'
  save_trigger: 'update at workspace root whenever coverage state, review date, or trigger meaningfully changes'
