metadata_schema_version: 1
name: 'coverage-tracker'
id: 'coverage-tracker'
display_name: 'Coverage Tracker'
version: '1.2.0'
system_generation: '5.38.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'memory'
summary: 'Maintain objective workspace coverage state with coverage status, monitor status, review dates, and next triggers.'
description: 'Maintain objective workspace coverage state with coverage status, monitor status, review dates, and next triggers.'
tags:
  - 'coverage-tracker'
  - 'coverage'
  - 'watchlist'
  - 'research-priority'
  - 'monitor-status'
trigger:
  type: 'keyword'
  keywords:
    - 'coverage'
    - 'update coverage'
    - 'coverage tracker'
    - '覆盖跟踪'
    - '重排优先级'
    - 'coverage status'
  description: 'Trigger when the user wants to update or review objective workspace coverage state.'
capabilities:
  generates: 'workspace COVERAGE.md with Coverage, Monitor, review date, and next trigger'
  feeds_into:
    - 'coverage-monitor'
    - 'research-journal'
  requirements:
    - 'each entry must have Coverage, Monitor, Last Review, and Next Trigger'
    - 'Coverage must stay objective and not depend on subjective conviction'
    - 'Monitor separates Core Watch from Daily Watch'
    - 'stock-quickread defaults to Building Coverage plus Daily Watch'
    - 'deep-work artifacts trigger Core Coverage review instead of blind auto-upgrade'
artifact_policy:
  save_policy: 'earned_memory'
  default_artifact: 'COVERAGE.md'
  canonical_location: 'COVERAGE.md'
  save_trigger: 'update at workspace root whenever coverage state, review date, or trigger meaningfully changes'
