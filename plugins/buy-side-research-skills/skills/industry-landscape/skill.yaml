metadata_schema_version: 1
name: 'industry-landscape'
id: 'industry-landscape'
display_name: 'Industry Landscape'
version: '1.0.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'foundation'
summary: 'Map industry value chain profit pools competitive dynamics and company roster with investment judgment.'
description: 'Map an industry value chain, profit pools, competitive dynamics, and company roster. Make an industry-level investment judgment. Requires product photos. Hands off to candidate-screener for company prioritization and mechanism-insight for single-mechanism deep dives.'
tags:
  - 'industry-landscape'
  - 'industry-map'
  - 'value-chain'
  - 'profit-pool'
  - 'competitive-dynamics'
  - 'company-roster'
  - 'industry-investment-judgment'
  - 'foundation'
trigger:
  type: 'keyword'
  keywords:
    - 'industry-landscape'
    - 'industry landscape'
    - '行业全景'
    - '行业格局'
    - '产业链地图'
    - '行业值不值得投'
    - '看看这个行业'
    - '行业利润在哪'
    - '行业有哪些玩家'
    - 'value chain map'
    - 'profit pool'
    - '行业竞争格局'
    - '行业投资判断'
    - '帮我看看这个行业'
    - '这个行业怎么看'
    - '给我一个行业 overview'
  description: '当用户要判断一个行业的投资价值、画产业链地图、分析利润池和竞争格局、建立公司注册表时触发。不做公司排序（→candidate-screener），不做零基础科普（→teach-in）。'
capabilities:
  modes:
    - 'Standard Industry Landscape'
    - 'Tight Landscape (abbreviated for narrow value chain slices)'
  output_path: 'industry/[industry-slug]/[YYYY-MM-DD]-industry-landscape.md when user asks to save'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'must include industry value chain ASCII diagram with profit pool annotations'
    - 'must include representative companies for each chain segment'
    - 'must include product/equipment photos for key products'
    - 'must include company roster table (unsorted, no recommendation)'
    - 'must include industry-level investment judgment with regime and variant view'
    - 'must include routing handoff to downstream skills'
    - 'must not do company prioritization (→candidate-screener)'
    - 'must not do zero-to-one physics education (→teach-in)'
    - 'must not do single-mechanism deep dive (→mechanism-insight)'
    - 'sub-agent_opt_in_only for parallel image downloads; main agent for all prose and ASCII diagrams'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'industry-landscape.md'
  canonical_location: 'industry/[industry-slug]/[YYYY-MM-DD]-industry-landscape.md'
  naming_mode: 'optional_qualifier'
  save_trigger: 'save only when user asks to preserve the industry landscape as dated topic research result'
workflow:
  stage: 'research-foundation'
  can_follow:
    - 'teach-in'
    - 'ingest'
    - 'information-impact'
    - ''
  feeds_into:
    - 'mechanism-insight'
    - 'candidate-screener'
    - 'peer-deep-dive'
    - 'stock-quickread'
    - 'consensus-map'
    - 'driver-map'
    - 'alpha-thesis'
    - 'research-journal'
  can_trigger:
    - ''
  decision_point: '行业是否值得继续研究、利润集中在产业链哪一段、下一步该看机制深挖还是公司筛选'
quality_gates:
  anti_patterns:
    - 'industry_textbook_without_investment_judgment'
    - 'value_chain_without_profit_pool_annotation'
    - 'company_roster_with_rankings'
    - 'no_company_logo_images'
    - 'no_product_photos'
    - 'doing_teach_in_level_physics_education'
    - 'doing_mechanism_insight_level_deep_dive'
    - 'doing_candidate_screener_level_prioritization'
    - 'no_routing_handoff'
    - 'missing_exposure_type_on_company_roster'
  data_requirements:
    - 'industry_value_chain_ascii_with_profit_pools'
    - 'competition_dynamics_table'
    - 'industry_drivers_with_specific_KPIs'
    - 'investment_judgment_with_regime_and_kill_criteria'
    - 'company_roster_with_exposure_types'
    - 'routing_handoff'
    - 'company_logo_images'
    - 'product_photos'
