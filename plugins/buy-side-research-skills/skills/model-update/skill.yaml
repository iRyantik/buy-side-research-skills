metadata_schema_version: 1
name: 'model-update'
id: 'model-update'
display_name: 'Model Update'
version: '1.1.0'
system_generation: '3.10.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'deep-work'
summary: 'Update a financial model for earnings guidance new data or revised assumptions.'
description: "Update a financial model for earnings guidance new data or revised assumptions."
tags:
  - model-update
  - earnings-update
  - refresh-estimates
  - xlsx
trigger:
  type: 'keyword'
  keywords:
    - 'update model'
    - 'refresh estimates'
    - 'plug earnings'
    - 'update numbers'
    - 'new guidance'
    - 'revise estimates'
  description: 'Use when the user wants to update an existing model after new actuals, guidance, or assumption changes.'
capabilities:
  modes:
    - 'earnings model update'
    - 'guidance refresh'
    - 'assumption revision'
    - 'update map'
    - 'model_sub_agent_protocol'
  consumes:
    - 'financial-data'
    - 'driver-map'
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
  preferred_inputs:
    - '_cache/financial-data/financial-data-summary.md'
    - '_cache/financial-data/internal/actuals-resolved.json'
    - '_cache/financial-data/internal/evidence-pack.json'
    - '_cache/driver-map/driver-map.md'
    - '_cache/driver-map/internal/driver-map.json'
    - '_models/<ticker>-3statement-model.xlsx'
    - '_models/<ticker>-3statement-dcf-model.xlsx'
    - '_models/<ticker>-comps-analysis.xlsx'
  output_path: 'industry/<industry>/_models/[ticker]-model-update.xlsx or [ticker]-update-map.md'
  requirements:
    - 'Prefer new financial-data actuals and driver-map changes before external or manual data.'
    - 'Separate reported actuals, revised assumptions, and formula changes.'
    - 'Do not overwrite user workbooks without explicit instruction.'
    - 'Use income_statement_quarterly_derived and cash_flow_quarterly_derived for single-quarter reported flow updates when present; never subtract balance sheet rows.'
    - 'main_agent_workbook_ownership_required'
    - 'source_map_and_completeness_check_required'
    - 'no_final_valuation_or_workbook_delivery_by_sub-agent'
    - 'no_missing_or_unmapped_actuals_as_zero'
artifact_policy:
  save_policy: 'external_workbook'
  default_artifact: '<ticker>-model-update.xlsx | <ticker>-update-map.md'
  canonical_location: 'industry/<industry>/_models/[ticker]-model-update.xlsx or [ticker]-update-map.md'
  save_trigger: 'write update map by default; write updated workbook only when user explicitly asks or provides target'
workflow:
  stage: 'model-maintenance'
  can_follow:
    - 'financial-data'
    - 'driver-map'
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
    - 'earnings-setup'
  feeds_into:
    - 'alpha-thesis'
    - 'research-journal'
  can_trigger:
    - 'research-journal'
quality_gates:
  anti_patterns:
    - 'Do not overwrite formulas, formats, or user assumptions without a change map.'
    - 'Do not plug missing or unmapped actuals as zero.'
    - 'Do not mix reported actuals with revised forward assumptions without labeling the change type.'
