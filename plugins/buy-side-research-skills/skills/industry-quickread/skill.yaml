metadata_schema_version: 1
name: 'industry-quickread'
id: 'industry-quickread'
display_name: 'Industry Quickread'
version: '1.1.0'
system_generation: '4.5.4'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'research'
research_layer: 'triage'
summary: 'Run a first pass on an industry theme value chain demand pocket or profit pool.'
description: 'Run a first pass on an industry theme value chain demand pocket or profit pool.'
tags:
  - 'industry-quickread'
  - 'industry-triage'
  - 'theme-research'
  - 'value-chain'
  - 'profit-pool'
  - 'primer'
trigger:
  type: 'keyword'
  keywords:
    - 'industry quickread'
    - '行业 quickread'
    - '快速看行业'
    - '这个行业值不值得研究'
    - 'value pool'
    - 'profit pool'
    - 'value chain'
  description: '当用户要快速判断一个陌生行业、主题或价值链是否值得继续研究时触发'
capabilities:
  archetype: 'Primer'
  fixed_layers:
    - 'Foundation Layer'
    - 'Interpretation Layer'
    - 'Research Layer'
    - 'Decision Layer'
  generates: 'layer-first industry first-pass with product map, regime view, and routing'
  output_format: 'markdown-first industry quickread with optional visual companion'
  modes:
    - 'Standard Industry First-Pass'
    - 'Tight Triage'
    - 'Mixed Mode'
  requirements:
    - 'follow CLAUDE.md source policy'
    - 'define industry boundary before analysis'
    - 'Product Map must appear early when the industry is not intuitively legible'
    - 'separate industry regime from company driver mapping'
    - 'limit anchor names to 3-5 and avoid full candidate screening'
    - 'route industry mechanism gaps to mechanism-map'
    - 'route company or segment model-driver gaps to driver-map'
    - 'route name generation to candidate-screener'
    - 'markdown is the primary artifact and research-viz is companion-only'
    - 'upgrade to research-viz when product, comparison, and market visuals would overload markdown'
    - 'sub-agent outputs must be evidence_cards_only'
    - 'main_agent_synthesis_required for industry routing and regime judgment'
    - 'sub-agent_opt_in_only unless the user explicitly requests sub-agent / delegate / parallel evidence collection'
artifact_policy:
  save_policy: 'optional_topic_result'
  default_artifact: 'industry-quickread.md'
  canonical_location: 'topics/[topic-namespace]/[topic-slug]/[YYYY-MM-DD]-industry-quickread.md'
  naming_mode: 'optional_qualifier'
  save_trigger: 'save only when user asks to preserve the industry first-pass as dated topic research result'
workflow:
  stage: 'industry-triage'
  can_follow:
    - 'new-session'
    - 'ingest'
    - 'information-impact'
    - 'next-step'
  feeds_into:
    - 'mechanism-map'
    - 'candidate-screener'
    - 'peer-deep-dive'
    - 'stock-quickread'
    - 'consensus-map'
    - 'driver-map'
    - 'primary-research-plan'
    - 'alpha-thesis'
    - 'research-journal'
    - 'research-viz'
  decision_point: 'whether the industry deserves more research time and where the next cut should be'
required_layers:
  - 'Foundation Layer'
  - 'Interpretation Layer'
  - 'Research Layer'
  - 'Decision Layer'
quality_gates:
  anti_patterns:
    - 'industry_intro_textbook'
    - 'sell_side_waterfall'
    - 'unsourced_market_size'
    - 'anchor_name_dump'
    - 'value_chain_without_value_capture'
    - 'missing_product_map_for_nonintuitive_industries'
  data_requirements:
    - 'current_regime_evidence'
    - 'value_pool_table'
    - 'kpi_source_map'
    - 'anchor_names_with_exposure_type'
    - 'routing_recommendation'
