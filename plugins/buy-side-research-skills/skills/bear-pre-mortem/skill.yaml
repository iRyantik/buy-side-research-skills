  includes:
    - 'short-pitch'
    - 'accounting-flags'
    - 'base-rate'
    - 'path-of-pain'
  emphasis: 'fact-driven, no hand-waving'
  requirements:
    - 'source links required'
    - 'base rate examples'
    - 'follow CLAUDE.md source policy'
