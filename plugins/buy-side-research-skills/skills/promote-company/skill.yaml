metadata_schema_version: 1
name: 'promote-company'
id: 'promote-company'
display_name: 'Promote Company'
version: '1.0.0'
system_generation: '3.9.0'
author: 'buy-side-research-system'
namespace: 'research.equity'
category: 'operations'
summary: 'Promote company-scoped research from an industry or theme workbench topic into a canonical company topic.'
description: 'Move clearly attributable company research artifacts, inbox files, raw files, and cache files from a workbench topic into topics/company/[company-slug]/ while preserving provenance and backlinks.'
tags:
  - 'promote-company'
  - 'company-promotion'
  - 'topic-organization'
  - 'industry-workbench'
  - 'company-canonical'
  - 'operations'
trigger:
  type: 'keyword'
  keywords:
    - 'promote-company'
    - 'promote company'
    - '沉淀到 company'
    - '沉淀公司'
    - '转到 company 目录'
    - 'company canonical topic'
  description: 'Trigger when the user wants to move company-scoped research out of an industry or theme workbench into a canonical company topic.'
capabilities:
  modes:
    - 'Promote Company'
    - 'Backlink Only'
    - 'Dry Run Move Plan'
  requirements:
    - 'create or locate topics/company/[company-slug]/index.md and _inbox/'
    - 'move source root files matching [YYYY-MM-DD]-[company-slug]-[artifact].md'
    - 'rename promoted markdown by removing the company slug prefix'
    - 'move clearly attributable _inbox, _raw, and _cache files'
    - 'leave mixed peer and industry files in source topic with backlinks'
    - 'preserve conflicts with -2, -3 suffixes'
    - 'update both source and company index.md with provenance'
    - 'do not write research conclusions'
    - 'do not replace integrate whole-topic merge behavior'
artifact_policy:
  save_policy: 'none'
  default_artifact: 'conversation-only'
  canonical_location: 'conversation-only'
  save_trigger: 'does not create standalone research artifacts; only moves company-scoped files and updates topic indexes when explicitly requested'
workflow:
  stage: 'topic-organization'
  can_follow:
    - 'new-session'
    - 'industry-quickread'
    - 'candidate-screener'
    - 'peer-deep-dive'
    - 'stock-quickread'
    - 'company-primer'
    - 'driver-map'
  feeds_into:
    - 'financial-data'
    - 'company-primer'
    - 'driver-map'
    - '3-statement-model'
    - 'dcf-model'
    - 'comps-analysis'
    - 'model-update'
    - 'research-journal'
  can_trigger: []
quality_gates:
  anti_patterns:
    - 'moving_industry_level_artifacts_by_default'
    - 'overwriting_existing_company_files'
    - 'rewriting_research_conclusions'
    - 'deleting_source_topic'
    - 'using_promote_company_for_whole_topic_merge'
    - 'moving_ambiguous_raw_or_cache_without_provenance'
  required_paths:
    - 'topics/company/[company-slug]/index.md'
    - 'topics/company/[company-slug]/_inbox/'
