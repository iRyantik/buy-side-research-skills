name: thesis-tracker
version: 2.0.0
author: buy-side-research-system
namespace: research.equity

summary: Thesis health 和 catalyst pipeline 跟踪
description: |
  读取 coverage/[ticker]/thesis.md、journal/decisions.md 和 pair thesis，
  判断 thesis health、assumption drift、kill criteria 和 catalyst pipeline。

trigger:
  keywords:
    - "thesis 还成立吗"
    - "更新 thesis health"
    - "catalyst pipeline"
    - "哪些持仓需要 review"
    - "帮我跟踪 thesis"
  description: "当用户要维护已有 thesis 或组合 catalyst pipeline 时触发"

category: research
tags:
  - thesis-tracker
  - catalyst
  - portfolio
  - health-check

capabilities:
  - reads: "coverage/[ticker]/thesis.md"
  - reads: "journal/decisions.md"
  - writes: "coverage/[ticker]/health-log.md"
  - writes: "portfolio/catalyst-pipeline.md"

requires:
  - "CLAUDE.md §3 source policy"

workflow_dependencies:
  - "consumes": "alpha-thesis state files"
  - "consumes": "decision-journal"
  - "can_trigger": "decision-journal review entry"
