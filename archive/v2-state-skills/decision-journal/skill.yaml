name: decision-journal
version: 2.0.0
author: buy-side-research-system
namespace: research.equity

summary: Append-only 投资决策日志
description: |
  记录 open/add/trim/close/review 决策，用 decision_v1 YAML blocks 写入
  journal/decisions.md，支持后续 conviction calibration 和 P/L attribution。

trigger:
  keywords:
    - "记录这个 decision"
    - "记录一下"
    - "建仓"
    - "加仓"
    - "减仓"
    - "平仓"
    - "写进 journal"
    - "复盘这个动作"
  description: "当用户要记录投资动作或复盘决策时触发"

category: research
tags:
  - decision-journal
  - portfolio
  - post-mortem
  - calibration

capabilities:
  - writes: "journal/decisions.md"
  - entry_schema: "decision_v1"
  - append_only: true

requires:
  - "CLAUDE.md §3 source policy"

workflow_dependencies:
  - "consumes": "coverage/[ticker]/thesis.md"
  - "feeds_into": "thesis-tracker"
  - "can_be_triggered_by": "earnings-setup"
